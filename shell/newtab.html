<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; object-src 'none'; base-uri 'none'; frame-src 'none'; img-src 'self' file: data: blob: https:; style-src 'self' 'unsafe-inline' file:; script-src 'self' 'unsafe-inline' file:; connect-src 'none'"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Next-Gen — Nueva pestaña</title>
<link rel="icon" href="../assets/brand/nova-icon.png">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--surface2:#eff1f4;--fg:#202124;--muted:#66707b;--border:rgba(32,35,40,.10);--accent:#3f6df6;--soft:rgba(63,109,246,.10);font-family:"Segoe UI Variable","Segoe UI",Inter,system-ui,sans-serif}
body.dark{--bg:#202124;--surface:#292a2d;--surface2:#303134;--fg:#e8eaed;--muted:#bdc1c6;--border:rgba(232,234,237,.12);--accent:#8ab4f8;--soft:rgba(138,180,248,.14)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);min-height:100vh}main{max-width:1160px;margin:auto;padding:30px 28px 52px}.hero{text-align:center;padding:20px 0 22px}.logo{width:56px;height:56px;object-fit:contain;margin-bottom:10px}.hero h1{margin:0;font-size:32px;letter-spacing:-.04em}.hero p{margin:8px auto 20px;max-width:640px;color:var(--muted);font-size:13px}.search{max-width:720px;margin:auto;display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--border);padding:5px;border-radius:10px;box-shadow:none}.search input{flex:1;border:0;outline:0;background:transparent;color:var(--fg);padding:10px 13px;font-size:14px}.search button,.chip,.refresh,.open{border:1px solid var(--border);background:var(--surface2);color:var(--fg);border-radius:7px;padding:8px 12px;cursor:pointer;font-size:11px}.search button{background:var(--accent);border-color:var(--accent);color:#fff}.section{margin-top:22px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.section h2{font-size:14px;margin:0;letter-spacing:-.01em}.tools{display:flex;gap:7px;flex-wrap:wrap}.chip.on{background:var(--soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 26%,var(--border))}.shortcuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}.shortcut{display:flex;align-items:center;gap:10px;padding:11px;background:var(--surface);border:1px solid var(--border);border-radius:9px;color:inherit;cursor:pointer;text-align:left;transition:border-color .1s ease,background .1s ease}.shortcut:hover{background:var(--surface2);border-color:color-mix(in srgb,var(--accent) 25%,var(--border))}.shortcut img{width:34px;height:34px;border-radius:10px;object-fit:contain;background:var(--surface2)}.shortcut b{font-size:12px}.shortcut small{display:block;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;font-size:10px}.news{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:none;transition:border-color .1s ease}.card:hover{border-color:color-mix(in srgb,var(--accent) 25%,var(--border))}.newsimg{display:block;width:100%;height:136px;object-fit:cover;background:var(--surface2)}.card-body{padding:13px}.tagline{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px;margin-bottom:6px}.tag{color:var(--accent);font-weight:600}.live{color:#2f8f59}.live.live-cache{color:#a26a18}.card h3{margin:0 0 7px;font-size:13px;line-height:1.4;font-weight:650}.card p{margin:0 0 12px;color:var(--muted);font-size:11px;line-height:1.55}.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}.status{margin-top:9px;font-size:10px;color:var(--muted)}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:14px}.skeleton{height:230px;border-radius:16px;background:var(--surface2)}@media(max-width:900px){.news{grid-template-columns:1fr 1fr}}@media(max-width:620px){main{padding:20px}.news{grid-template-columns:1fr}.hero h1{font-size:28px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.release-note{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:720px;margin:0 auto 8px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:9px}
.release-note div{display:flex;flex-direction:column;gap:4px;min-width:0}.release-note strong{font-size:12px;font-weight:650}.release-note span{font-size:11px;color:var(--muted);line-height:1.45}.release-note .open{flex:none;white-space:nowrap}
.shortcut-icon{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.skeleton{border-radius:10px}
@media(max-width:620px){.release-note{align-items:flex-start;flex-direction:column}.release-note .open{align-self:flex-start}}
</style></head>
<body><main>
<section class="hero"><img class="logo" src="../assets/brand/nova-icon.png" alt="Nova"><h1>Nova</h1><p>Una nueva pestaña rápida para continuar, buscar y volver a tus sitios importantes.</p><form class="search" id="search"><input id="q" placeholder="Buscar o escribir una dirección" autocomplete="off"><button>Buscar</button></form></section>
<section class="release-note" aria-label="Novedades de Nova"><div><strong>Nova 5.5.1 · Next-Gen</strong><span>Nueva identidad 3D, fondos personalizados para la barra y una interfaz más contenida.</span></div><button id="releaseNotes" class="open">Ver novedades</button></section>
<section class="section"><div class="section-head"><h2>Accesos rápidos</h2></div><div class="shortcuts" id="shortcuts"></div></section>
<section class="section"><div class="section-head"><h2>Noticias</h2><div class="tools"><button class="chip" data-topic="todas">Todas</button><button class="chip" data-topic="tecnologia">Tecnología</button><button class="chip" data-topic="videojuegos">Gaming</button><button class="chip" data-topic="codigo">Dev</button><button class="refresh" id="refresh">Actualizar</button></div></div><div class="news" id="news"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div><div id="status" class="status">Cargando fuentes…</div></section>
<section class="section"><div class="section-head"><h2>Continuar</h2></div><div class="shortcuts"><button class="shortcut" id="tour"><svg class="shortcut-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 21 8v8l-9 5-9-5V8l9-5Z M3 8l9 5 9-5 M12 13v8"/></svg><span><b>Guía de inicio</b><small>Repasa las funciones principales de Nova.</small></span></button><button class="shortcut" id="command"><svg class="shortcut-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5H5v3M16 5h3v3M5 16v3h3M19 16v3h-3M9 9h6v6H9z"/></svg><span><b>Nova Command</b><small>Ctrl+K para buscar pestañas y acciones.</small></span></button></div></section>
</main><script>
const nova=window.novaNewTab;const openInNova=url=>{if(nova?.navigate){nova.navigate(url);return true}document.getElementById('status').textContent='La conexión con Nova no está disponible. Cierra esta pestaña y abre una nueva.';return false};const p=new URLSearchParams(location.search);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
let state={};try{state=JSON.parse(p.get('state')||'{}')}catch{};const ap=state.appearance||'system';const systemTheme=matchMedia('(prefers-color-scheme: dark)');const applyHomeTheme=()=>document.body.classList.toggle('dark',ap==='dark'||(ap==='system'&&systemTheme.matches));applyHomeTheme();systemTheme.addEventListener?.('change',()=>{if(ap==='system')applyHomeTheme()});if(/^#[0-9a-f]{6}$/i.test(state.accent||'')){document.documentElement.style.setProperty('--accent',state.accent);document.documentElement.style.setProperty('--soft',`color-mix(in srgb, ${state.accent} 12%, transparent)`)}
const items=Array.isArray(state.bookmarks)?state.bookmarks.slice(0,8):[];const shortcuts=document.getElementById('shortcuts');if(!items.length){shortcuts.innerHTML='<div class="shortcut"><svg class="shortcut-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg><span><b>No hay accesos rápidos</b><small>Usa la estrella de Nova para guardar páginas.</small></span></div>'}else{shortcuts.innerHTML=items.map((x,i)=>{let host='';try{host=new URL(x.url).hostname.replace(/^www\./,'')}catch{host=x.url||''}return `<button class="shortcut" data-open="${esc(x.url)}"><img data-f="${i}" src="../assets/brand/nova-icon.png" alt=""><span><b>${esc(x.title||host||'Sitio')}</b><small>${esc(host)}</small></span></button>`}).join('');items.forEach((x,i)=>{try{const u=new URL(x.url),im=document.querySelector(`[data-f="${i}"]`);if(im){im.src=u.origin+'/favicon.ico';im.onerror=()=>{im.onerror=null;im.src='../assets/brand/nova-icon.png'}}}catch{}});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openInNova(b.dataset.open))}
document.getElementById('search').onsubmit=e=>{e.preventDefault();const v=document.getElementById('q').value.trim();if(!v)return;if(!openInNova(v))document.getElementById('status').textContent='No se pudo iniciar la búsqueda. Vuelve a abrir una pestaña nueva.'};
let topic='todas';const setActive=()=>document.querySelectorAll('[data-topic]').forEach(b=>b.classList.toggle('on',b.dataset.topic===topic));setActive();document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{topic=b.dataset.topic;setActive();load()});document.getElementById('refresh').onclick=()=>load(true);document.getElementById('tour').onclick=()=>{if(nova?.openTour)nova.openTour();else openInNova('')};document.getElementById('command').onclick=()=>{if(nova?.openCommand)nova.openCommand();else openInNova('')};document.getElementById('releaseNotes').onclick=()=>{if(nova?.openWhatsNew)nova.openWhatsNew();else document.getElementById('status').textContent='Abre las novedades desde el menú de Nova.'};
const fmt=x=>{try{return x?new Date(x).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}):''}catch{return''}};
async function load(force=false){const box=document.getElementById('news');box.innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';document.getElementById('status').textContent='Consultando fuentes…';try{if(!nova?.newsFeed)throw new Error('Nova bridge unavailable');const d=await nova.newsFeed({topic,force});const xs=Array.isArray(d?.items)?d.items:[];box.innerHTML=xs.length?xs.map(x=>{const img=/^https?:\/\//i.test(String(x.image||''))?`<img class="newsimg" loading="lazy" src="${esc(x.image)}" alt="" onerror="this.remove()">`:'';const live=x.kind==='live'&&d.live;const liveText=d.stale?'● En caché':live?'● En vivo':'Nova Briefing';return `<article class="card">${img}<div class="card-body"><div class="tagline"><span class="tag">${esc(x.source||'Nova')}</span><span class="live ${d.stale?'live-cache':''}">${liveText}</span></div><h3>${esc(x.title||'Sin título')}</h3><p>${esc(String(x.summary||'').slice(0,360))}</p><div class="card-foot"><span style="color:var(--muted);font-size:10px">${esc(fmt(x.date)||'')}</span><button class="open" data-url="${esc(x.url||'https://www.chromium.org/')}">Abrir →</button></div></div></article>`}).join(''):'<div class="empty">No hay noticias disponibles.</div>';box.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>openInNova(b.dataset.url));document.getElementById('status').textContent=d.live?(d.stale?'Fuentes no disponibles; mostrando el último feed real guardado.':'Fuentes en vivo: '+(d.sources||[]).join(' · ')):'Sin fuentes disponibles; mostrando Nova Briefing (contenido interno).'}catch{box.innerHTML='<div class="empty">No se pudieron cargar las noticias ahora mismo.</div>';document.getElementById('status').textContent='Sin fuentes disponibles; mostrando Nova Briefing (contenido interno).'}}
load();
</script></body></html>
