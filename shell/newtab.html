<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova</title>
<link rel="stylesheet" href="themes.css">
<link rel="icon" href="../assets/icon.png">
<style>
:root{--nt-glass:color-mix(in srgb,var(--bar) 72%,transparent);--nt-glass-strong:color-mix(in srgb,var(--bar) 90%,transparent);--nt-border:color-mix(in srgb,var(--bd) 84%,transparent)}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Inter,"Segoe UI Variable","Segoe UI",system-ui,sans-serif}
body{min-height:100vh;overflow:auto;display:flex;justify-content:center;background:radial-gradient(circle at 15% -10%,color-mix(in srgb,var(--acc) 12%,transparent),transparent 30%),radial-gradient(circle at 90% 110%,color-mix(in srgb,var(--acc2) 11%,transparent),transparent 28%),var(--bg);color:var(--fg)}
#backdrop{position:fixed;inset:-4%;z-index:-2;background:center/cover no-repeat;transform:scale(1.03);transition:opacity .35s,transform .5s ease-out;opacity:0}
body.hasbg #backdrop{opacity:1}
body.hasbg::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,.40))}
#shell{width:min(980px,calc(100vw - 48px));min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:50px 0 38px;gap:26px}
#meta{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--nt-border);border-radius:999px;background:var(--nt-glass);backdrop-filter:blur(22px) saturate(145%);box-shadow:0 10px 28px rgba(0,0,0,.06);font-size:12px;color:var(--mut)}
#account{color:var(--fg)}#account img{width:18px;height:18px;border-radius:50%;object-fit:cover}
#clock{font-size:13px;color:var(--mut)}
#hero{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;margin-top:7vh}
.logo{width:66px;height:66px;object-fit:contain;filter:drop-shadow(0 16px 30px color-mix(in srgb,var(--acc) 22%,transparent))}
h1{margin:0;font-size:62px;line-height:1;font-weight:350;letter-spacing:-.045em}
#tag{margin:0;color:var(--mut);font-size:15px}
#search{width:min(760px,100%);position:relative;margin-top:8px}
#search input{width:100%;height:58px;padding:0 22px 0 52px;border-radius:29px;background:var(--nt-glass-strong);border:1px solid var(--nt-border);color:var(--fg);outline:none;font-size:16px;box-shadow:0 18px 50px rgba(0,0,0,.09),inset 0 1px rgba(255,255,255,.18);backdrop-filter:blur(25px) saturate(150%);transition:.2s}
#search input:focus{border-color:color-mix(in srgb,var(--acc) 44%,transparent);box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 12%,transparent),0 22px 60px rgba(0,0,0,.11)}
#search::before{content:"⌕";position:absolute;left:20px;top:12px;font-size:27px;line-height:32px;color:var(--mut);pointer-events:none}
#search::after{content:"Enter";position:absolute;right:11px;top:12px;height:34px;display:grid;place-items:center;padding:0 10px;border-radius:9px;background:color-mix(in srgb,var(--fg) 6%,transparent);color:var(--mut);font-size:11px;pointer-events:none}
#shortcuts{width:min(760px,100%);display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.shortcut{min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:16px;color:var(--fg);text-decoration:none;background:var(--nt-glass);border:1px solid var(--nt-border);box-shadow:0 12px 30px rgba(0,0,0,.06),inset 0 1px rgba(255,255,255,.14);backdrop-filter:blur(22px) saturate(135%);transition:transform .18s,border-color .18s,background .18s}
.shortcut:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 35%,var(--nt-border));background:var(--nt-glass-strong)}
.shortcut img{width:27px;height:27px;border-radius:8px;object-fit:contain}.shortcut .fallback{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);font-weight:700}.shortcut span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
#recent{width:min(760px,100%);display:flex;flex-direction:column;gap:9px;margin-top:2px}
.section-title{font-size:12px;font-weight:650;color:var(--mut);text-transform:uppercase;letter-spacing:.10em;padding:0 4px}
.recent-card{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:14px;background:var(--nt-glass);border:1px solid var(--nt-border);backdrop-filter:blur(20px)}
.recent-card img{width:18px;height:18px;border-radius:5px}.recent-card a{flex:1;min-width:0;color:var(--fg);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.recent-card a:hover{color:var(--acc)}.recent-card small{max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}
#footer{margin-top:auto;color:var(--mut);font-size:11px;display:flex;align-items:center;gap:8px}.dot{width:4px;height:4px;border-radius:50%;background:var(--mut)}
body.hasbg #tag,body.hasbg #clock,body.hasbg .section-title,body.hasbg #footer{color:rgba(255,255,255,.78)}
body.hasbg #shell{filter:drop-shadow(0 12px 55px rgba(0,0,0,.12))}
body.noanim *{animation:none!important;transition:none!important}
@media(max-width:800px){#shortcuts{grid-template-columns:repeat(3,1fr)}#hero{margin-top:4vh}h1{font-size:52px}}
@media(max-width:520px){#shell{width:min(100% - 24px,980px);padding-top:22px}#meta{align-items:flex-start}.pill{padding:7px 10px}#account span{display:none}#clock{font-size:11px}#shortcuts{grid-template-columns:repeat(3,1fr);gap:7px}.shortcut{padding:12px 5px}#search input{height:54px}#search::after{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="backdrop"></div>
<div id="shell">
  <div id="meta"><div id="account" class="pill"><img src="../assets/icon.png"><span>Nova</span></div><div id="clock" class="pill"></div></div>
  <section id="hero">
    <img id="logo" class="logo" src="../assets/icon.png" alt="Nova">
    <h1>Nova</h1>
    <p id="tag">Tu espacio para navegar.</p>
    <form id="search"><input id="q" autocomplete="off" autofocus placeholder="Busca o escribe una dirección"></form>
    <div id="shortcuts"></div>
  </section>
  <section id="recent" hidden></section>
  <div id="footer">Nova Browser <span class="dot"></span> navegación rápida y limpia</div>
</div>
<script>
const p=new URLSearchParams(location.search);
const J=(k,d)=>{try{const v=JSON.parse(p.get(k)||'');return v??d}catch{return d}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let theme=p.get('t')||'air';if(theme==='system')theme='air';document.body.className='t-'+theme;
const logoId=(p.get('l')||'classic').match(/^[a-z]+$/)?.[0]||'classic';if(logoId!=='classic')document.getElementById('logo').src='../assets/logos/'+logoId+'.png';
const acc=p.get('a');if(acc)document.body.style.setProperty('--acc',acc);
const name=p.get('n')||'';if(name)document.querySelector('#account span').textContent=name;else document.querySelector('#account span').textContent='Cuenta Nova';
if(p.get('wp')){document.body.classList.add('hasbg');document.getElementById('backdrop').style.backgroundImage=`url("${p.get('wp')}")`;document.addEventListener('mousemove',e=>{const x=(.5-e.clientX/innerWidth)*18,y=(.5-e.clientY/innerHeight)*12;document.getElementById('backdrop').style.transform=`scale(1.04) translate(${x}px,${y}px)`})}
const D=Object.assign({clock:true,anim:true},J('d',{}));if(D.anim===false)document.body.classList.add('noanim');
const clock=document.getElementById('clock');
if(D.clock){const tick=()=>clock.textContent=new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}).format(new Date());tick();setInterval(tick,30000)}else clock.remove();
const search=p.get('s')||'https://duckduckgo.com/?q=';
document.getElementById('search').onsubmit=e=>{e.preventDefault();const v=document.getElementById('q').value.trim();if(!v)return;location.href=/^https?:\/\//i.test(v)?v:/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(v)?'https://'+v:search+encodeURIComponent(v)};
const quick=J('x',[]);const marks=J('b',[]);const defaults=[{t:'YouTube',u:'https://www.youtube.com'},{t:'GitHub',u:'https://github.com'},{t:'Discord',u:'https://discord.com'},{t:'ChatGPT',u:'https://chatgpt.com'},{t:'Wikipedia',u:'https://www.wikipedia.org'},{t:'Google',u:'https://www.google.com'}];
const links=(quick.length?quick:marks.length?marks:defaults).slice(0,6);const wrap=document.getElementById('shortcuts');wrap.innerHTML=links.map((m,i)=>{const title=esc((m.t||m.u||'Acceso').slice(0,20));let host='';try{host=new URL(m.u).hostname}catch{};const icon=host?`<img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64" alt="">`:`<span class="fallback">${esc(title.slice(0,1).toUpperCase())}</span>`;return `<a class="shortcut" href="${esc(m.u)}" title="${title}">${icon}<span>${title}</span></a>`}).join('');
const rec=J('r',[]).slice(0,6);if(rec.length){const box=document.getElementById('recent');box.hidden=false;box.innerHTML='<div class="section-title">Recientes</div>'+rec.map(m=>{let host='';try{host=new URL(m.u).hostname}catch{};return `<div class="recent-card"><img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=32" alt=""><a href="${esc(m.u)}">${esc(m.t||m.u)}</a><small>${esc(host)}</small></div>`}).join('')}
</script>
</body>
</html>
