<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova — Nueva pestaña</title>
<style>
:root{--bg:#08080d;--fg:#f6f3ff;--mut:#9d98aa;--bar:#11111a;--bd:#292532;--acc:#9b5cff;--acc2:#c89eff;--r:18px}
.light{--bg:#f7f7fb;--fg:#171725;--mut:#6b6b85;--bar:#fff;--bd:#dedee8;--acc:#5b3df5;--acc2:#6f57d8}.light{}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;color:var(--fg);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg)}
body{position:relative;overflow-x:hidden;background:radial-gradient(900px 480px at 88% -8%,color-mix(in srgb,var(--acc) 18%,transparent),transparent 62%),radial-gradient(650px 420px at 4% 72%,color-mix(in srgb,var(--acc2) 12%,transparent),transparent 68%),var(--bg)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:54px 54px;mask-image:linear-gradient(to bottom,#000,transparent 80%)}
#bg{position:fixed;inset:-7%;background-position:center;background-size:cover;filter:saturate(.8) brightness(.38);opacity:.28;pointer-events:none;transition:transform .25s ease}body.hasbg:after{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 10%,transparent 15%,#08080dcc 72%);pointer-events:none}
main{position:relative;z-index:1;width:min(1140px,92vw);margin:0 auto;padding:48px 0 55px}.head{display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px}.brand b{font-size:22px;letter-spacing:.1em}.brand small{display:block;color:var(--mut);margin-top:2px}.clock{color:var(--mut);font-size:12px}
.hero{text-align:center;padding:54px 0 25px}.hero h1{font-size:16px;font-weight:500;color:#c7c2d1;margin:0 0 22px}.search{width:min(780px,100%);margin:auto;height:62px;display:flex;align-items:center;gap:12px;padding:0 18px;background:rgba(17,16,24,.86);border:1px solid #3b3348;border-radius:21px;box-shadow:0 20px 70px #0006,0 0 34px rgba(155,92,255,.10);backdrop-filter:blur(14px)}.search span{font-size:23px;color:#8f899a}.search input{flex:1;border:0;outline:0;background:none;color:var(--fg);font-size:16px}.search input::placeholder{color:#7d7788}.search button{border:0;border-radius:12px;padding:10px 16px;background:linear-gradient(135deg,#9b5cff,#6d39d2);color:#fff;font-weight:700;cursor:pointer}.hint{margin-top:11px;color:#6e6876;font-size:11px}
.section{margin-top:30px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.section-head h2{margin:0;font-size:15px}.section-head button{background:none;border:0;color:var(--acc2);cursor:pointer;font-size:12px}.news{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{min-height:155px;padding:16px;border:1px solid var(--bd);border-radius:18px;background:rgba(17,16,23,.84);backdrop-filter:blur(10px);transition:.18s transform,.18s border-color,.18s box-shadow}.card:hover{transform:translateY(-2px);border-color:#4b3a5e;box-shadow:0 18px 40px #0004}.tag{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--acc);font-weight:800}.card h3{font-size:16px;line-height:1.35;margin:8px 0}.card p{margin:0;color:var(--mut);font-size:12px;line-height:1.55}.meta{margin-top:12px;color:#6f6979;font-size:10px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.pill{padding:8px 11px;border:1px solid var(--bd);border-radius:999px;background:rgba(17,16,23,.7);color:#aca6b6;font-size:11px}
@media(max-width:780px){.news{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.clock{align-self:flex-start}.hero{padding-top:38px}.search button{padding:9px 12px}}
</style></head><body><div id="bg"></div><main><div class="head"><div class="brand"><img class="logo" src="../assets/icon.png" alt="Nova"><div><b>Nova</b><small>Libre · Premium · Gaming</small></div></div><div class="clock" id="clock"></div></div>
<section class="hero"><h1>Busca, descubre y sigue navegando.</h1><form class="search" id="f"><span>⌕</span><input id="s" placeholder="Busca en la web o escribe una dirección" autocomplete="off"><button>Buscar</button></form><div class="hint">Privacidad activa · sincronización cifrada · extensiones seguras</div></section>
<section class="section"><div class="section-head"><h2>Noticias para ti</h2><button id="refresh">Actualizar</button></div><div class="news" id="news"></div></section>
<div class="quick"><span class="pill">🛡 Protección inteligente</span><span class="pill">🚫 Bloqueador de anuncios</span><span class="pill">☁️ Sync</span><span class="pill">🎮 Perfil Gaming</span><span class="pill">🌍 Traducción</span><span class="pill">🧑‍💻 DevTools</span></div>
</main>
<script>
const p=new URLSearchParams(location.search),J=(k,d)=>{try{return JSON.parse(p.get(k)||'')}catch{return d}};
let theme=p.get('t')||'system';const a=p.get('a');if(a&&/^#[0-9a-f]{3,8}$/i.test(a))document.documentElement.style.setProperty('--acc',a);
const light=theme==='light'||(theme==='system'&&matchMedia('(prefers-color-scheme:light)').matches);if(light)document.documentElement.classList.add('light');
const n=document.querySelector('.logo');
const wp=p.get('wp');if(wp){document.body.classList.add('hasbg');document.getElementById('bg').style.backgroundImage=`url("${wp}")`;document.addEventListener('mousemove',e=>document.getElementById('bg').style.transform=`translate(${(.5-e.clientX/innerWidth)*18}px,${(.5-e.clientY/innerHeight)*12}px)`)}
const clock=document.getElementById('clock');const name=p.get('n');function tick(){clock.textContent=(name?'Hola, '+name+' · ':'')+new Date().toLocaleString('es-ES',{weekday:'long',hour:'2-digit',minute:'2-digit',day:'numeric',month:'long'})}tick();setInterval(tick,30000);
const search=p.get('s')||'https://duckduckgo.com/?q=';document.getElementById('f').onsubmit=e=>{e.preventDefault();const v=document.getElementById('s').value.trim();if(!v)return;location.href=/^https?:\/\//i.test(v)?v:/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(v)?'https://'+v:search+encodeURIComponent(v)};
const topic=p.get('sec')||'videojuegos';const sets={videojuegos:[['GAMING','El mundo del PC gaming sigue evolucionando','Hardware, juegos y experiencias que merecen un hueco en tu próxima sesión.'],['LANZAMIENTOS','Novedades para tu biblioteca','Descubre tendencias y lanzamientos sin salir de tu nueva pestaña.'],['TECNOLOGÍA','Herramientas para jugar y crear','Rendimiento, periféricos y software para usuarios avanzados.']],codigo:[['DEVELOPMENT','Herramientas para desarrolladores','Atajos, rendimiento web y nuevas posibilidades del navegador.'],['WEB','La web cambia rápido','Estándares, APIs y experiencias modernas para construir mejor.'],['OPEN SOURCE','Proyectos que inspiran','Ideas y herramientas de comunidades abiertas.']],coches:[['MOTOR','Tecnología sobre ruedas','Diseño, innovación y novedades del mundo del automóvil.'],['MOVILIDAD','Nuevas formas de moverse','Tendencias que mezclan software, hardware y movilidad.'],['DISEÑO','Diseño que se mueve','Conceptos, materiales y experiencias.']]};
function render(){const arr=sets[topic]||sets.videojuegos;document.getElementById('news').innerHTML=arr.map(x=>`<article class="card"><div class="tag">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><div class="meta">Recomendado para ti · Nova</div></article>`).join('')}render();document.getElementById('refresh').onclick=()=>{const box=document.getElementById('news');box.animate([{opacity:.35},{opacity:1}],{duration:350});render()};
</script></body></html>
