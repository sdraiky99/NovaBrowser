<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Nueva pestaña · Nova</title>
<style>
:root{color-scheme:light;--bg:#fff;--surface:#fff;--surface-2:#f1f3f4;--surface-3:#e8eaed;--fg:#202124;--muted:#5f6368;--border:#dadce0;--accent:var(--user-accent,#1a73e8);--soft:color-mix(in srgb,var(--accent) 12%,transparent);--shadow:0 3px 12px rgba(60,64,67,.12);--font:"Segoe UI Variable","Segoe UI",Inter,system-ui,sans-serif}
body.dark{color-scheme:dark;--bg:#202124;--surface:#292a2d;--surface-2:#303134;--surface-3:#3c4043;--fg:#e8eaed;--muted:#bdc1c6;--border:#45464a;--shadow:0 4px 14px rgba(0,0,0,.25)}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px}button,input{font:inherit;color:inherit}button{border:0}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button{cursor:pointer}main{max-width:1120px;margin:0 auto;padding:34px clamp(20px,5vw,60px) 52px}.topline{display:flex;justify-content:flex-end;align-items:center;gap:8px;min-height:32px}.top-action{padding:8px 11px;border-radius:var(--pill,999px);background:transparent;color:var(--muted);font-size:12px}.top-action:hover{background:var(--surface-2);color:var(--fg)}.hero{display:flex;flex-direction:column;align-items:center;padding:54px 0 34px;text-align:center}.brand-lockup{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:23px}.logo{width:49px;height:49px;object-fit:contain}.hero h1{font-size:48px;line-height:1;font-weight:650;letter-spacing:-.055em;margin:0}.hero p{max-width:520px;color:var(--muted);font-size:14px;line-height:1.55;margin:15px 0 24px}.search{display:flex;align-items:center;width:min(680px,100%);height:54px;gap:10px;padding:0 8px 0 17px;border:1px solid var(--border);border-radius:var(--pill,999px);background:var(--surface);box-shadow:0 1px 3px rgba(60,64,67,.12);transition:box-shadow .15s,border-color .15s}.search:hover,.search:focus-within{box-shadow:0 3px 12px rgba(60,64,67,.18);border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}.search svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round}.search-icon{width:20px;height:20px;object-fit:contain;flex:none;opacity:.8}.search input{flex:1;width:100%;min-width:0;border:0;background:transparent;outline:0;font-size:14px}.search input::placeholder{color:var(--muted)}.search button{height:38px;min-width:74px;padding:0 16px;border-radius:var(--pill,999px);background:var(--surface-2);font-weight:550;font-size:12px}.search button:hover{background:var(--surface-3)}
.section{margin-top:30px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:13px}.section-head h2{font-size:15px;font-weight:650;letter-spacing:-.015em;margin:0}.section-head .tools{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.chip,.refresh{padding:7px 10px;border-radius:var(--pill,999px);font-size:11px;background:transparent;color:var(--muted)}.chip:hover,.refresh:hover{background:var(--surface-2);color:var(--fg)}.chip.on{background:var(--soft);color:var(--accent);font-weight:650}.shortcuts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.shortcut{display:flex;align-items:center;gap:11px;min-width:0;padding:12px 13px;border:1px solid transparent;border-radius:11px;background:transparent;text-align:left;transition:background .12s,border-color .12s}.shortcut:hover{background:var(--surface-2);border-color:var(--border)}.shortcut .site-icon{width:36px;height:36px;min-width:36px;display:grid;place-items:center;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:650;overflow:hidden}.shortcut img{width:22px;height:22px;object-fit:contain}.shortcut .text{min-width:0;display:flex;flex-direction:column;gap:3px}.shortcut b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shortcut small{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shortcut.add{border:1px dashed var(--border);justify-content:flex-start}.shortcut.add:hover{border-color:var(--accent)}.shortcut.add .site-icon{font-size:20px;background:var(--surface-2)}
.news{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:14px;transition:border-color .12s,transform .12s}.card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--border));transform:translateY(-1px)}.newsimg{display:block;width:100%;height:146px;object-fit:cover;background:var(--surface-2)}.card-body{display:flex;flex-direction:column;flex:1;padding:14px 15px 13px}.tagline{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px;margin-bottom:9px}.tag{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650;color:var(--accent)}.live{flex:none;color:#188038;font-size:10px}.live.live-cache{color:#b06000}.card h3{font-size:14px;line-height:1.42;letter-spacing:-.01em;font-weight:650;margin:0 0 8px}.card p{font-size:12px;line-height:1.55;color:var(--muted);margin:0 0 15px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto}.card-date{font-size:10px;color:var(--muted)}.open{padding:7px 9px;border-radius:8px;background:transparent;color:var(--accent);font-weight:600;font-size:11px}.open:hover{background:var(--soft)}.status{margin-top:11px;color:var(--muted);font-size:11px;line-height:1.5}.skeleton{height:240px;border-radius:14px;background:linear-gradient(100deg,var(--surface-2) 20%,var(--surface-3) 35%,var(--surface-2) 50%);background-size:200% 100%;animation:shimmer 1.4s ease infinite}.empty{grid-column:1/-1;padding:24px;text-align:center;border:1px dashed var(--border);border-radius:13px;color:var(--muted);line-height:1.5}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:35px;padding-top:15px;border-top:1px solid var(--border);color:var(--muted);font-size:10px}.footer-actions{display:flex;gap:8px}.footer button{background:transparent;color:var(--muted);font-size:10px}.footer button:hover{color:var(--accent)}.notice{margin-top:12px;font-size:11px;color:var(--muted)}@keyframes shimmer{to{background-position:-200% 0}}
@media(max-width:900px){main{padding-top:24px}.hero{padding:38px 0 24px}.shortcuts{grid-template-columns:repeat(2,minmax(0,1fr))}.news{grid-template-columns:repeat(2,minmax(0,1fr))}.news .card:last-child:nth-child(odd){grid-column:1/-1}}@media(max-width:600px){main{padding:16px 14px 30px}.hero{padding:32px 0 18px}.hero h1{font-size:39px}.brand-lockup{margin-bottom:18px}.logo{width:42px;height:42px}.hero p{font-size:12px}.search{height:49px}.section{margin-top:24px}.section-head{align-items:flex-start;flex-direction:column}.section-head .tools{width:100%}.shortcuts,.news{grid-template-columns:1fr}.news .card:last-child:nth-child(odd){grid-column:auto}.shortcut{padding:10px}.newsimg{height:175px}.footer{align-items:flex-start;flex-direction:column}}
.quick-modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(32,33,36,.42)}.quick-modal.open{display:flex}.quick-dialog{width:min(430px,100%);padding:22px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}.quick-dialog h2{font-size:18px;letter-spacing:-.025em;margin:0 0 6px}.quick-dialog p{font-size:12px;line-height:1.5;color:var(--muted);margin:0 0 18px}.quick-field{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:12px;font-weight:600}.quick-field input{min-height:39px;width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--fg);font:inherit;font-weight:400}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.dialog-actions button{min-height:35px;padding:8px 13px;border-radius:var(--pill,999px);font-size:12px}.dialog-cancel{background:var(--surface-2)}.dialog-save{background:var(--accent);color:white;font-weight:600}.dialog-error{min-height:16px;margin-top:8px;color:#c5221f;font-size:11px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main>
<div class="topline"><button class="top-action" id="releaseNotes">Novedades de Nova 6</button><button class="top-action" id="customize">Ajustes</button></div>
<section class="hero"><div class="brand-lockup"><img class="logo" src="../assets/brand/nova-icon.png" alt=""><h1>Nova</h1></div><p>Un buen punto de partida para buscar, volver a tus sitios y descubrir lo que te interesa.</p><form class="search" id="search"><img class="search-icon" src="../assets/icons/search.svg" alt=""><input id="q" placeholder="Buscar con Google o escribir una dirección" autocomplete="off" aria-label="Buscar en la web"><button type="submit">Buscar</button></form></section>
<section class="section"><div class="section-head"><h2>Accesos rápidos</h2></div><div class="shortcuts" id="shortcuts"></div></section>
<div id="shortcutModal" class="quick-modal" aria-hidden="true"><form id="shortcutForm" class="quick-dialog" role="dialog" aria-modal="true" aria-labelledby="shortcutDialogTitle"><h2 id="shortcutDialogTitle">Añadir acceso rápido</h2><p>Guarda una página para tenerla siempre a mano en tus nuevas pestañas.</p><label class="quick-field">Nombre<input id="shortcutName" maxlength="80" required placeholder="Ej. Mi página"></label><label class="quick-field">Dirección web<input id="shortcutUrl" maxlength="2048" required placeholder="https://ejemplo.com"></label><div id="shortcutError" class="dialog-error" role="status"></div><div class="dialog-actions"><button type="button" class="dialog-cancel" id="shortcutCancel">Cancelar</button><button type="submit" class="dialog-save">Guardar acceso</button></div></form></div>
<section class="section"><div class="section-head"><h2>Noticias para ti</h2><div class="tools"><button class="chip on" data-topic="todas">Todas</button><button class="chip" data-topic="tecnologia">Tecnología</button><button class="chip" data-topic="videojuegos">Gaming</button><button class="chip" data-topic="codigo">Desarrollo</button><button class="refresh" id="refresh">Actualizar</button></div></div><div class="news" id="news"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div><div id="status" class="status" role="status" aria-live="polite">Cargando noticias…</div></section>
<div class="footer"><span>Nova 6.0.1 · Chrome Hybrid</span><div class="footer-actions"><button id="tour">Guía de inicio</button><button id="command">Nova Command</button></div></div>
</main>
<script>
const nova=window.novaNewTab;
const openInNova=value=>{const raw=String(value??'').trim();if(!raw)return false;if(nova?.navigate){nova.navigate(raw);return true}try{const looksLikeUrl=/^(https?:\/\/|localhost(?::\d+)?(?:\/|$)|127\.0\.0\.1(?::\d+)?(?:\/|$)|[\w.-]+\.[a-z]{2,}(?::\d+)?(?:[\/?#]|$))/i.test(raw);const target=looksLikeUrl?( /^[a-z][a-z0-9+.-]*:\/\//i.test(raw)?raw:'https://'+raw):'https://www.google.com/search?q='+encodeURIComponent(raw);location.href=target;return true}catch{document.getElementById('status').textContent='No se pudo abrir la búsqueda. Comprueba la conexión e inténtalo de nuevo.';return false}};
const params=new URLSearchParams(location.search);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={};try{state=JSON.parse(params.get('state')||'{}')}catch{}
let appearance=state.appearance||'system';const systemTheme=matchMedia('(prefers-color-scheme: dark)');
const applyHomeTheme=()=>{document.body.classList.toggle('dark',appearance==='dark'||(appearance==='system'&&systemTheme.matches));};applyHomeTheme();systemTheme.addEventListener?.('change',()=>{if(appearance==='system')applyHomeTheme()});
if(/^#[0-9a-f]{6}$/i.test(state.accent||'')){document.documentElement.style.setProperty('--user-accent',state.accent);document.documentElement.style.setProperty('--accent',state.accent);document.documentElement.style.setProperty('--soft',`color-mix(in srgb, ${state.accent} 12%, transparent)`)}
const shortcuts=document.getElementById('shortcuts');const defaults=[['Google','https://www.google.com/','G'],['YouTube','https://www.youtube.com/','Y'],['Wikipedia','https://www.wikipedia.org/','W'],['GitHub','https://github.com/','⌘']];
function paintShortcuts(){const bookmarks=Array.isArray(state.bookmarks)?state.bookmarks.filter(x=>x&&/^https?:/i.test(x.url||'')).slice(0,7):[];const list=bookmarks.length?bookmarks.map(x=>({title:x.title||hostOf(x.url),url:x.url})):defaults.map(x=>({title:x[0],url:x[1],fallback:x[2]}));const entries=list.map((x,i)=>{const host=hostOf(x.url);const fallback=x.fallback||String(x.title||host).slice(0,1).toUpperCase();return `<button class="shortcut" data-open="${esc(x.url)}"><span class="site-icon" data-icon="${i}">${esc(fallback)}</span><span class="text"><b>${esc(x.title||host)}</b><small>${esc(host)}</small></span></button>`}).join('');shortcuts.innerHTML=entries+`<button class="shortcut add" id="addShortcut"><span class="site-icon">+</span><span class="text"><b>Añadir acceso</b><small>Cómo guardar una web</small></span></button>`;list.forEach((x,i)=>{try{const u=new URL(x.url);const icon=shortcuts.querySelector(`[data-icon="${i}"]`);if(icon){const img=document.createElement('img');img.alt='';img.loading='lazy';img.src=u.origin+'/favicon.ico';img.onerror=()=>{img.remove();icon.textContent=fallback};icon.textContent='';icon.appendChild(img)}}catch{}});shortcuts.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openInNova(b.dataset.open));document.getElementById('addShortcut').onclick=()=>{const modal=document.getElementById('shortcutModal');modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.getElementById('shortcutError').textContent='';document.getElementById('shortcutName').focus()};}
function hostOf(url){try{return new URL(url).hostname.replace(/^www\./,'')}catch{return String(url||'')}}paintShortcuts();
document.getElementById('search').addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('q').value.trim();if(!v){document.getElementById('q').focus();return}openInNova(v)});
let topic='todas';const setActive=()=>document.querySelectorAll('[data-topic]').forEach(b=>b.classList.toggle('on',b.dataset.topic===topic));setActive();document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{topic=b.dataset.topic;setActive();loadNews()});document.getElementById('refresh').onclick=()=>loadNews(true);document.getElementById('tour').onclick=()=>nova?.openTour?.();document.getElementById('command').onclick=()=>nova?.openCommand?.();document.getElementById('releaseNotes').onclick=()=>nova?.openWhatsNew?.();
document.getElementById('shortcutCancel').onclick=()=>{const modal=document.getElementById('shortcutModal');modal.classList.remove('open');modal.setAttribute('aria-hidden','true')};document.getElementById('shortcutModal').addEventListener('click',e=>{if(e.target.id==='shortcutModal')document.getElementById('shortcutCancel').click()});document.getElementById('shortcutForm').addEventListener('submit',e=>{e.preventDefault();const title=document.getElementById('shortcutName').value.trim();let url=document.getElementById('shortcutUrl').value.trim();const error=document.getElementById('shortcutError');if(!title||!url){error.textContent='Rellena el nombre y la dirección.';return}if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(url))url='https://'+url;try{const parsed=new URL(url);if(!['http:','https:'].includes(parsed.protocol)||!parsed.hostname.includes('.'))throw new Error('url');if(!nova?.addShortcut){error.textContent='Esta versión de Nova no permite guardar accesos desde esta página.';return}nova.addShortcut(title,parsed.href);document.getElementById('shortcutModal').classList.remove('open');document.getElementById('shortcutModal').setAttribute('aria-hidden','true');document.getElementById('status').textContent='Acceso enviado a Nova para guardarlo.'}catch{error.textContent='Escribe una dirección web válida, como ejemplo.com.'}});window.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('shortcutCancel').click()}});document.getElementById('customize').onclick=()=>nova?.openSettings?.();
const fmt=x=>{try{return x?new Date(x).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}):''}catch{return''}};
async function loadNews(force=false){const box=document.getElementById('news');box.innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';document.getElementById('status').textContent='Consultando fuentes…';try{if(!nova?.newsFeed)throw new Error('Nova bridge unavailable');const data=await nova.newsFeed({topic,force});const items=Array.isArray(data?.items)?data.items:[];box.innerHTML=items.length?items.map(x=>{const image=/^https?:\/\//i.test(String(x.image||''))?`<img class="newsimg" loading="lazy" src="${esc(x.image)}" alt="" onerror="this.remove()">`:'';const isLive=x.kind==='live'&&data.live;const status=data.stale?'En caché':isLive?'En directo':'Sin conexión';return `<article class="card">${image}<div class="card-body"><div class="tagline"><span class="tag">${esc(x.source||'Fuente')}</span><span class="live ${data.stale?'live-cache':''}">${status}</span></div><h3>${esc(x.title||'Sin título')}</h3><p>${esc(String(x.summary||'').slice(0,360))}</p><div class="card-foot"><span class="card-date">${esc(fmt(x.date)||'')}</span><button class="open" data-url="${esc(x.url||'https://www.chromium.org/')}">Leer noticia ↗</button></div></div></article>`}).join(''):'<div class="empty">No hay noticias disponibles en esta categoría ahora mismo.</div>';box.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>openInNova(b.dataset.url));document.getElementById('status').textContent=data.stale?'No se pudo actualizar la fuente; mostramos las últimas noticias guardadas.':data.live?'Fuentes actualizadas: '+(data.sources||[]).join(' · '):'No hay conexión con las fuentes en directo. Inténtalo de nuevo más tarde.'}catch{box.innerHTML='<div class="empty">No se han podido cargar las noticias. Puedes seguir usando la búsqueda y los accesos rápidos.</div>';document.getElementById('status').textContent='Noticias temporalmente no disponibles.'}}
loadNews();
</script></body></html>
