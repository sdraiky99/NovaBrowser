<!doctype html><html><head><meta charset="utf-8"><title>Nova</title>
<link rel="stylesheet" href="themes.css"><link rel="icon" href="../assets/icon.png">
<style>
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--bg)}
#bg{position:fixed;inset:-5%;background:center/cover no-repeat;transition:transform .25s ease-out;z-index:-1}
main>*{animation:up .7s cubic-bezier(.2,.8,.2,1) both}main>*:nth-child(2){animation-delay:.08s}main>*:nth-child(3){animation-delay:.16s}main>*:nth-child(4){animation-delay:.24s}main>*:nth-child(5){animation-delay:.32s}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(#0006,#0009);z-index:0}
body.t-win95::before,body.t-aero::before{background:none}
main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:20px;width:min(640px,90vw)}
.logo{width:84px;animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
h1{margin:0;font-size:64px;font-weight:200;letter-spacing:.06em;color:var(--fg)}
form{width:100%}
input{width:100%;padding:14px 18px;background:var(--bar);border:1px solid var(--bd);border-radius:var(--r);color:var(--fg);outline:none;font-size:16px}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 35%,transparent)}
.q{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.q a{padding:8px 16px;background:var(--bar);border:1px solid var(--bd);border-radius:var(--r);color:var(--fg);text-decoration:none}
.q a:hover{border-color:var(--acc);color:var(--acc)}
body.t-win95 h1,body.t-undertale h1,body.t-code h1{font-weight:700;letter-spacing:0}
body.t-code h1::before{content:"> ";color:var(--acc)}body.t-code h1::after{content:"_";animation:bl 1s steps(1) infinite}
body.t-win95 input,body.t-win95 .q a{box-shadow:inset 1px 1px #808080,inset -1px -1px #fff;border:0}
body.t-win95 h1{text-shadow:1px 1px #fff}
body.t-undertale input,body.t-undertale .q a{border-width:3px}
body.t-aero{background-image:linear-gradient(160deg,#9fd0f5,#e8f4fd 60%,#b6e0a5)}
body.t-aero input,body.t-aero .q a{backdrop-filter:blur(8px);box-shadow:inset 0 1px #fff}
#clock{color:var(--fg);font-size:18px;opacity:.85}
@keyframes pop{from{transform:scale(.3);opacity:0}}@keyframes bl{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<main><img class="logo" src="../assets/icon.png"><h1>Nova</h1><div id="clock"></div>
<form id="f"><input id="s" placeholder="Busca o escribe una dirección" autofocus></form>
<div class="q"><a href="https://www.youtube.com">YouTube</a><a href="https://github.com">GitHub</a><a href="https://store.steampowered.com">Steam</a><a href="https://www.wikipedia.org">Wikipedia</a></div></main>
<script>
const p=new URLSearchParams(location.search);document.body.className='t-'+(p.get('t')||'nova');
if(p.get('wp')){const b=document.createElement('div');b.id='bg';b.style.backgroundImage=`url("${p.get('wp')}")`;document.body.prepend(b);document.addEventListener('mousemove',e=>{b.style.transform=`translate(${(.5-e.clientX/innerWidth)*24}px,${(.5-e.clientY/innerHeight)*16}px)`})}
const tick=()=>clock.textContent=(p.get('n')?'Hola, '+p.get('n')+' · ':'')+new Date().toLocaleString('es',{weekday:'long',hour:'2-digit',minute:'2-digit',day:'numeric',month:'long'});tick();setInterval(tick,3e4);
f.onsubmit=e=>{e.preventDefault();const v=s.value.trim();if(!v)return;
location.href=/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(v)||/^https?:\/\//.test(v)?(v.startsWith('http')?v:'https://'+v):(p.get('s')||'https://duckduckgo.com/?q=')+encodeURIComponent(v)};
if(p.get('a'))document.body.style.setProperty('--acc',p.get('a'));
try{const b=JSON.parse(p.get('b')||'[]');if(b.length)document.querySelector('.q').innerHTML=b.map(m=>`<a href="${m.u}">${(m.t||m.u).slice(0,22).replace(/</g,'')}</a>`).join('')}catch{}
</script></body></html>
