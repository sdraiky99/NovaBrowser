<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nueva pestaña</title><link rel="icon" href="../assets/brand/nova-icon.png"><style>
:root{--bg:#f5f6f8;--surface:#fff;--surface2:#eceff3;--fg:#1e232b;--muted:#69717d;--border:rgba(30,35,43,.1);--accent:#3f6df6;--accent-soft:rgba(63,109,246,.12);--font:Inter,"Segoe UI Variable","Segoe UI",system-ui,sans-serif}body.dark{--bg:#111318;--surface:#1a1d23;--surface2:#242831;--fg:#f0f3f7;--muted:#a4acb8;--border:rgba(255,255,255,.1);--accent:#7ea2ff;--accent-soft:rgba(126,162,255,.14)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:var(--font)}main{max-width:1120px;margin:0 auto;padding:34px 30px 54px}.hero{text-align:center;padding:38px 0 24px}.logo{width:64px;height:64px;object-fit:contain;margin-bottom:9px}.hero h1{margin:0;font-size:34px;letter-spacing:-.04em}.hero p{margin:9px auto 20px;max-width:610px;color:var(--muted);font-size:13px}.search{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px;box-shadow:0 10px 30px rgba(20,25,35,.06)}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:10px 12px;font-size:14px;color:var(--fg)}.search button{border:0;border-radius:999px;padding:9px 15px;background:var(--accent);color:#fff;cursor:pointer}.section{margin-top:22px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.section h2{font-size:16px;margin:0}.tools{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:7px 11px;font-size:11px;color:var(--muted);cursor:pointer}.chip.on{background:var(--accent-soft);color:var(--accent);border-color:rgba(63,109,246,.28)}.refresh{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 11px;font-size:11px;cursor:pointer}.shortcuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.shortcut{display:flex;align-items:center;gap:10px;padding:12px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:15px;cursor:pointer}.shortcut:hover{border-color:rgba(63,109,246,.3);transform:translateY(-1px)}.shortcut img{width:34px;height:34px;border-radius:10px;object-fit:contain;background:var(--surface2)}.shortcut b{font-size:12px}.shortcut small{display:block;color:var(--muted);font-size:10px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}.news{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:var(--surface);border:1px solid var(--border);border-radius:17px;overflow:hidden;transition:150ms ease}.card:hover{transform:translateY(-2px)}.newsimg{display:block;width:100%;height:140px;object-fit:cover;background:var(--surface2)}.card-body{padding:13px}.tagline{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px;margin-bottom:6px}.tag{font-weight:600;color:var(--accent)}.live.live-on{color:#2c9b62}.live.live-cache{color:#b07a20}.card h3{font-size:14px;line-height:1.35;margin:0 0 8px}.card p{font-size:11px;line-height:1.5;color:var(--muted);margin:0 0 12px}.card-foot{display:flex;justify-content:space-between;gap:8px;align-items:center}.open{background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:7px 10px;cursor:pointer;font-size:10px}.status{margin-top:10px;color:var(--muted);font-size:10px}.skeleton{height:240px;border-radius:17px;background:linear-gradient(100deg,var(--surface2) 0%,var(--surface) 45%,var(--surface2) 100%);background-size:220% 100%;animation:shine 1.1s infinite}@keyframes shine{to{background-position:-220% 0}}@media(max-width:900px){.news{grid-template-columns:1fr 1fr}}@media(max-width:620px){main{padding:20px}.news{grid-template-columns:1fr}.hero h1{font-size:28px}.section-head{align-items:flex-start;flex-direction:column}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main>
<section class="hero"><img class="logo" src="../assets/brand/nova-icon.png" alt="Nova"><h1>Nova</h1><p>Una nueva pestaña limpia, rápida y útil. Tus sitios fijados, noticias en vivo y lo que necesitas para volver a navegar.</p><form class="search" id="search"><input id="q" placeholder="Buscar o escribir una dirección" autocomplete="off"><button>Buscar</button></form></section>
<section class="section"><div class="section-head"><h2>Accesos rápidos</h2></div><div class="shortcuts" id="shortcuts"></div></section>
<section class="section"><div class="section-head"><h2>Noticias</h2><div class="tools"><button class="chip" data-topic="todas">Todas</button><button class="chip" data-topic="tecnologia">Tecnología</button><button class="chip" data-topic="videojuegos">Gaming</button><button class="chip" data-topic="codigo">Dev</button><button class="refresh" id="refresh">Actualizar</button></div></div><div class="news" id="news"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div><div id="status" class="status">Cargando fuentes…</div></section>
<section class="section"><div class="section-head"><h2>Consejos de Nova</h2></div><div class="shortcuts"><div class="shortcut"><span>⌘</span><span><b>Ctrl+K</b><small>Abre la búsqueda global</small></span></div><div class="shortcut"><span>☆</span><span><b>Ctrl+D</b><small>Guarda un favorito</small></span></div><div class="shortcut"><span>↗</span><span><b>Ctrl+T</b><small>Abre una pestaña nueva</small></span></div></div></section>
</main><script>
const ipc=require('electron').ipcRenderer;const p=new URLSearchParams(location.search);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state=(()=>{try{return JSON.parse(p.get('state')||'{}')}catch{return{}}})();const prefersDark=matchMedia('(prefers-color-scheme: dark)').matches;const ap=state.appearance||'system';document.body.classList.toggle('dark',ap==='dark'||(ap==='system'&&prefersDark));if(state.accent&&/^#[0-9a-f]{6}$/i.test(state.accent))document.documentElement.style.setProperty('--accent',state.accent);document.documentElement.style.setProperty('--accent-soft',`color-mix(in srgb, ${state.accent||'#3f6df6'} 12%, transparent)`);
const shortcuts=document.getElementById('shortcuts');const items=Array.isArray(state.bookmarks)?state.bookmarks.slice(0,8):[];if(!items.length){shortcuts.innerHTML='<div class="shortcut"><span>☆</span><span><b>No hay accesos fijados</b><small>Usa la estrella de la barra para guardar páginas.</small></span></div>'}else{shortcuts.innerHTML=items.map((x,i)=>{let host='';try{host=new URL(x.url).hostname.replace(/^www\./,'')}catch{host=x.url||''}return `<button class="shortcut" data-open="${esc(x.url)}"><img src="../assets/brand/nova-icon.png" data-f="${i}" alt=""><span><b>${esc(x.title||host||'Sitio')}</b><small>${esc(host)}</small></span></button>`}).join('');items.forEach((x,i)=>{try{const u=new URL(x.url),im=document.querySelector(`[data-f="${i}"]`);if(im){im.src=u.origin+'/favicon.ico';im.onerror=()=>{im.onerror=null;im.src='../assets/brand/nova-icon.png'}}}catch{}});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>location.href=b.dataset.open)}
const search=state.search||'https://www.google.com/search?q=';document.getElementById('search').onsubmit=e=>{e.preventDefault();const v=document.getElementById('q').value.trim();if(!v)return;location.href=/^(https?|file):\/\//i.test(v)?v:/^[\w-]+(\.[\w-]+)+(\/.*)?$/i.test(v)?'https://'+v:search+encodeURIComponent(v)};
let topic='todas';const setActive=()=>document.querySelectorAll('[data-topic]').forEach(b=>b.classList.toggle('on',b.dataset.topic===topic));setActive();document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{topic=b.dataset.topic;setActive();load()});document.getElementById('refresh').onclick=()=>load(true);
const fmt=x=>{try{return x?new Date(x).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}):''}catch{return''}};
async function load(force=false){const box=document.getElementById('news');box.innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';document.getElementById('status').textContent='Consultando fuentes…';try{const d=await ipc.invoke('news-feed',{topic,force});const items=Array.isArray(d?.items)?d.items:[];box.innerHTML=items.map(x=>{const img=/^https?:\/\//i.test(String(x.image||''))?`<img class="newsimg" loading="lazy" src="${esc(x.image)}" alt="" onerror="this.remove()">`:'';const live=x.kind==='live'&&d.live;const liveClass=d.stale?'live-cache':live?'live-on':'';const liveText=d.stale?'● En caché':live?'● En vivo':'Nova Briefing';return `<article class="card">${img}<div class="card-body"><div class="tagline"><span class="tag">${esc(x.source||'Nova')}</span><span class="live ${liveClass}">${liveText}</span></div><h3>${esc(x.title||'Sin título')}</h3><p>${esc(String(x.summary||'').slice(0,360))}</p><div class="card-foot"><span class="muted">${esc(fmt(x.date)||'')}</span><button class="open" data-url="${esc(x.url||'https://www.chromium.org/')}">Abrir →</button></div></div></article>`}).join('')||'<div class="empty">No hay noticias disponibles.</div>';box.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>location.href=b.dataset.url);document.getElementById('status').textContent=d.live?(d.stale?'Fuentes no disponibles; mostrando el último feed real guardado.':'Fuentes en vivo: '+(d.sources||[]).join(' · ')):'Sin fuentes disponibles: mostrando Nova Briefing, contenido interno marcado como tal.'}catch{box.innerHTML='<div class="empty">No se pudieron cargar las noticias ahora mismo.</div>';document.getElementById('status').textContent='Sin fuentes disponibles: mostrando Nova Briefing, contenido interno marcado como tal.'}}
load();
</script></body></html>
