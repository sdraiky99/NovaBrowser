<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Nova Browser</title>
  <link rel="icon" href="../assets/icon.png">
  <link rel="stylesheet" href="themes.css">
</head>
<body class="t-nova">
<div id="app">
  <header id="topbar">
    <div id="brand"><img src="../assets/icon.png" alt="Nova"><div><b>Nova</b><small>Browser</small></div></div>
    <div id="tabs"></div>
    <button class="winbtn" id="newtab" title="Nueva pestaña (Ctrl+T)">+</button>
    <div id="window-controls"><button class="winbtn" data-win="min">—</button><button class="winbtn" data-win="max">□</button><button class="winbtn close" data-win="close">×</button></div>
  </header>

  <section id="toolbar">
    <div class="navgroup">
      <button class="iconbtn" id="back" title="Atrás (Alt+←)">‹</button>
      <button class="iconbtn" id="forward" title="Adelante (Alt+→)">›</button>
      <button class="iconbtn" id="reload" title="Recargar (Ctrl+R)">↻</button>
      <button class="iconbtn" id="home" title="Inicio (Alt+Home)">⌂</button>
    </div>
    <div id="address-wrap">
      <span id="security">◉</span>
      <input id="address" autocomplete="off" spellcheck="false" placeholder="Busca o escribe una dirección" aria-label="Dirección o búsqueda">
      <div id="address-suggestions" class="suggestions hidden"></div>
      <button id="clear-address" class="tinybtn" title="Borrar">×</button>
      <button id="privacy-badge" class="tinybtn" title="Protección y privacidad">🛡</button>
      <button id="bookmark" class="tinybtn" title="Añadir a favoritos (Ctrl+D)">☆</button>
    </div>
    <div class="toolbar-actions">
      <span id="blocked-count" class="pill">0 bloqueados</span>
      <button class="iconbtn" id="findbtn" title="Buscar en la página (Ctrl+F)">⌕</button>
      <button class="iconbtn" id="printbtn" title="Guardar como PDF">⤓</button>
      <button class="iconbtn" id="menu-btn" title="Menú">☰</button>
    </div>
  </section>

  <main id="body">
    <aside id="sidebar">
      <button class="sidebtn active" data-panel="home" title="Inicio">⌂</button>
      <button class="sidebtn" data-panel="bookmarks" title="Favoritos">☆</button>
      <button class="sidebtn" data-panel="history" title="Historial">◷</button>
      <button class="sidebtn" data-panel="downloads" title="Descargas">⇩</button>
      <button class="sidebtn" data-panel="notes" title="Notas">✎</button>
      <button class="sidebtn" data-panel="tools" title="Herramientas">✦</button>
      <div class="side-spacer"></div>
      <button class="sidebtn" data-panel="settings" title="Ajustes">⚙</button>
      <button class="sidebtn private" id="private-tab" title="Nueva pestaña privada (Ctrl+Shift+N)">◉</button>
    </aside>

    <section id="workspace">
      <div id="view"></div>
      <div id="findbar"><input id="findinput" placeholder="Buscar en la página"><span id="findcount">0 / 0</span><button class="tinybtn" id="findprev">↑</button><button class="tinybtn" id="findnext">↓</button><button class="tinybtn" id="findclose">×</button></div>
      <div id="sidepanel"><div id="panel-content"></div></div>
    </section>
  </main>

  <footer id="statusbar"><span id="status">Listo</span><span id="shortcut-hint">Ctrl+K comandos · Ctrl+Shift+N privada · Ctrl+Shift+T reabrir</span></footer>
</div>

<div id="command-palette" class="overlay hidden"><div class="palette"><input id="command-search" placeholder="¿Qué quieres hacer?" autofocus><div id="command-list"></div></div></div>
<div id="tab-menu" class="tab-menu hidden">
  <button data-tab-action="new">Nueva pestaña a la derecha</button>
  <button data-tab-action="duplicate">Duplicar pestaña</button>
  <button data-tab-action="pin">Fijar / desfijar</button>
  <button data-tab-action="mute">Silenciar / activar sonido</button>
  <div class="menu-sep"></div>
  <button data-tab-action="close">Cerrar pestaña</button>
  <button data-tab-action="close-others">Cerrar las demás</button>
  <button data-tab-action="close-right">Cerrar las de la derecha</button>
</div>
<div id="toast-stack"></div>

<script>
const { ipcRenderer: ipc } = require('electron');
const fs = require('fs');
const path = require('path');
const os = require('os');
const { pathToFileURL } = require('url');

const $ = (s, root = document) => root.querySelector(s);
const $$ = (s, root = document) => [...root.querySelectorAll(s)];
const ud = ipc.sendSync('userdata');

const defaults = {
  theme: 'nova', search: 'https://duckduckgo.com/?q=', home: '', adblock: true,
  anim: true, name: '', wp: '', bookmarks: [], history: [], downloads: [], notes: '',
  zoom: 1, accent: '', recent: [], restoreTabs: true, compactTabs: false, openTabs: [], startupMode: 'restore', showNewTab: true
};
const S = Object.assign({}, defaults, JSON.parse(localStorage.nova || '{}'));
const save = () => localStorage.nova = JSON.stringify(S);
const THEMES = { nova: 'Nova', neon: 'Neón', code: 'Código', win95: 'Windows 95', undertale: 'Undertale', aero: 'Aero' };
const SEARCHERS = {
  duck: ['DuckDuckGo', 'https://duckduckgo.com/?q='], google: ['Google', 'https://www.google.com/search?q='],
  bing: ['Bing', 'https://www.bing.com/search?q='], brave: ['Brave', 'https://search.brave.com/search?q=']
};
const MODS = {
  dark: ['Oscuro forzado', 'html{filter:invert(1) hue-rotate(180deg)} img,video,canvas{filter:invert(1) hue-rotate(180deg)}'],
  reader: ['Modo lectura', 'header,nav,aside,footer,[class*=ad-],[id*=banner],[role=banner]{display:none!important}body{max-width:820px!important;margin:auto!important;font:18px/1.75 Georgia,serif!important}'],
  noanim: ['Sin animaciones web', '*{animation:none!important;transition:none!important;scroll-behavior:auto!important}'],
  large: ['Texto grande', 'html{zoom:1.15}']
};
S.mods = S.mods || {};
S.wallSection = S.wallSection || 'videojuegos';
S.privateBlocked = S.privateBlocked ?? true;

function applyTheme() {
  document.body.className = `t-${S.theme}${S.anim ? '' : ' noanim'}`;
  if (S.accent) document.body.style.setProperty('--acc', S.accent); else document.body.style.removeProperty('--acc');
  ipc.invoke('adblock', !!S.adblock);
}

function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
function isInternal(url) { return url && url.includes('/shell/newtab.html'); }
function normalize(v) {
  const value = v.trim();
  if (!value) return '';
  if (/^(https?|file):\/\//i.test(value)) return value;
  if (/^[\w.-]+\.[a-z]{2,}(:\d+)?(\/.*)?$/i.test(value) || /^localhost(:\d+)?(\/.*)?$/i.test(value) || /^127\.0\.0\.1(:\d+)?/.test(value)) return `https://${value}`;
  return S.search + encodeURIComponent(value);
}
function newTabURL(privateMode = false) {
  const payload = {
    t: S.theme, s: S.search, n: S.name || '', a: S.accent || '', wp: S.wp || '',
    b: (S.bookmarks || []).slice(0, 8), h: (S.history || []).slice(0, 6), private: privateMode
  };
  return pathToFileURL(path.join(__dirname, 'newtab.html')).href + '?data=' + encodeURIComponent(JSON.stringify(payload));
}

let tabs = [];
let current = null;
let panel = 'home';
let closedTabs = JSON.parse(localStorage.novaClosed || '[]');
let downloads = Array.isArray(S.downloads) ? S.downloads : [];
let blocked = 0;
let contextTab = null;
let draggingTab = null;

function updateAddress() {
  if (!current) return;
  const url = current.wv.getURL() || '';
  $('#address').value = isInternal(url) ? '' : url;
  const secure = /^https:\/\//i.test(url);
  $('#security').textContent = secure ? '🔒' : '◉';
  $('#security').style.opacity = secure ? '1' : '.5';
  const mark = S.bookmarks.some(m => m.url === url);
  $('#bookmark').textContent = mark ? '★' : '☆';
  $('#bookmark').classList.toggle('on', mark);
  if (current.wv.isCrashed?.()) $('#status').textContent = 'La pestaña tuvo un problema';
}

function addHistory(t) {
  if (!t || t.privateMode) return;
  const url = t.wv.getURL();
  if (!url || isInternal(url) || /^https:\/\/(localhost|127\.0\.0\.1)/.test(url)) return;
  const title = t.title || url;
  S.history = (S.history || []).filter(h => h.url !== url);
  S.history.unshift({ title, url, time: Date.now() });
  S.history = S.history.slice(0, 300);
  save();
}


function saveSession() {
  S.openTabs = tabs.filter(t => !t.privateMode).map(t => ({ url: t.wv.getURL(), pinned: !!t.pinned, title: t.title })).filter(x => x.url && !isInternal(x.url)).slice(0, 24);
  save();
}
function reorderTab(a, b) {
  const from = tabs.indexOf(a), to = tabs.indexOf(b);
  if (from < 0 || to < 0 || from === to) return;
  const item = tabs.splice(from, 1)[0];
  tabs.splice(to, 0, item);
  if (from < to) $('#tabs').insertBefore(item.el, tabs[to]?.el || null);
  else $('#tabs').insertBefore(item.el, tabs[to].el);
  saveSession();
}
function showTabMenu(x, y) {
  const m = $('#tab-menu'); m.classList.remove('hidden');
  m.style.left = `${Math.min(window.innerWidth - 260, Math.max(8, x))}px`;
  m.style.top = `${Math.min(window.innerHeight - 330, Math.max(52, y))}px`;
}
function hideTabMenu() { $('#tab-menu').classList.add('hidden'); contextTab = null; }
function toggleTabMute(tab) {
  if (!tab) return;
  tab.muted = !tab.muted;
  try { tab.wv.setAudioMuted(tab.muted); } catch {}
  $('.tab-state', tab.el).textContent = tab.muted ? '🔇' : '';
  saveSession();
  toast(tab.muted ? 'Pestaña silenciada' : 'Sonido activado');
}
function toggleTabPin(tab) {
  if (!tab) return;
  tab.pinned = !tab.pinned;
  tab.el.classList.toggle('pinned', tab.pinned);
  const title = $('.tab-title', tab.el);
  title.style.display = tab.pinned ? 'none' : '';
  saveSession();
}
function duplicateTab(tab) {
  if (!tab) return;
  createTab(tab.wv.getURL() || newTabURL(false), tab.privateMode, true);
}
function toggleCurrentMod(key) {
  if (!current) return;
  S.mods[key] = !S.mods[key];
  save();
  applyMod(current.wv, key, S.mods[key]);
  toast(`${MODS[key]?.[0] || key}: ${S.mods[key] ? 'activado' : 'desactivado'}`);
}

function createTab(url = newTabURL(false), privateMode = false, activate = true) {
  const wv = document.createElement('webview');
  wv.setAttribute('allowpopups', '');
  wv.setAttribute('partition', privateMode ? 'nova-private' : 'persist:nova');
  wv.setAttribute('webpreferences', 'contextIsolation=no');
  wv.src = url;
  $('#view').appendChild(wv);

  const el = document.createElement('div');
  el.className = 'tab';
  el.draggable = true; el.innerHTML = `<span class="pin-mark" title="Fijada">◆</span><span class="tab-favicon"><img src="../assets/icon.png"></span><span class="tab-title">Nueva pestaña</span><span class="tab-state"></span><span class="private-dot">${privateMode ? '◉' : ''}</span><button class="tab-close" title="Cerrar">×</button>`;
  $('#tabs').appendChild(el);
  const tab = { id: crypto.randomUUID(), wv, el, title: 'Nueva pestaña', privateMode, lastUrl: url, pinned: false, muted: false };
  tabs.push(tab);

  el.onmousedown = e => { if (e.button === 1) { e.preventDefault(); closeTab(tab); } };
  el.onclick = e => { if (e.target.closest('.tab-close')) closeTab(tab); else selectTab(tab); };
  el.addEventListener('contextmenu', e => { e.preventDefault(); contextTab = tab; showTabMenu(e.clientX, e.clientY); });
  el.addEventListener('dragstart', e => { draggingTab = tab; e.dataTransfer.effectAllowed = 'move'; el.classList.add('dragging'); });
  el.addEventListener('dragend', () => { draggingTab = null; el.classList.remove('dragging'); });
  el.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
  el.addEventListener('drop', e => { e.preventDefault(); if (draggingTab && draggingTab !== tab) reorderTab(draggingTab, tab); });

  const sync = () => {
    tab.lastUrl = wv.getURL();
    if (current === tab) updateAddress();
    if (tab.lastUrl && !isInternal(tab.lastUrl)) addHistory(tab);
  };
  wv.addEventListener('page-title-updated', e => { tab.title = e.title || 'Nueva pestaña'; $('.tab-title', el).textContent = tab.title; sync(); });
  wv.addEventListener('page-favicon-updated', e => { const icon = e.favicons?.[0]; if (icon) $('.tab-favicon img', el).src = icon; });
  wv.addEventListener('media-started-playing', () => { $('.tab-state', el).textContent = tab.muted ? '🔇' : '♪'; });
  wv.addEventListener('media-paused', () => { $('.tab-state', el).textContent = tab.muted ? '🔇' : ''; });
  wv.addEventListener('did-start-loading', () => { el.classList.add('loading'); $('#status').textContent = 'Cargando…'; });
  wv.addEventListener('did-stop-loading', () => { el.classList.remove('loading'); $('#status').textContent = 'Listo'; sync(); });
  wv.addEventListener('did-navigate', sync);
  wv.addEventListener('did-navigate-in-page', sync);
  wv.addEventListener('dom-ready', () => {
    Object.keys(S.mods || {}).forEach(k => S.mods[k] && applyMod(wv, k, true));
    wv.setZoomFactor?.(S.zoom || 1);
  });
  wv.addEventListener('page-fail-load', e => { if (!e.isMainFrame) return; toast(`No se pudo cargar la página (${e.errorCode})`); });

  if (activate) selectTab(tab);
  return tab;
}

function selectTab(tab) {
  if (!tab) return;
  current = tab;
  tabs.forEach(t => { t.el.classList.toggle('active', t === tab); t.wv.classList.toggle('visible', t === tab); });
  updateAddress();
}

function closeTab(tab, record = true) {
  if (!tab) return;
  const idx = tabs.indexOf(tab);
  if (record && !tab.privateMode) {
    closedTabs.unshift({ url: tab.wv.getURL() || newTabURL(false), title: tab.title });
    closedTabs = closedTabs.slice(0, 15);
    localStorage.novaClosed = JSON.stringify(closedTabs);
  }
  try { tab.wv.remove(); } catch {}
  tab.el.remove();
  tabs.splice(idx, 1);
  if (!tabs.length) return createTab();
  if (current === tab) selectTab(tabs[Math.max(0, idx - 1)]);
  saveSession();
}

function reopenClosed() {
  const item = closedTabs.shift();
  localStorage.novaClosed = JSON.stringify(closedTabs);
  if (item) createTab(item.url || newTabURL(false)); else toast('No hay pestañas cerradas para reabrir');
}

function navigate(value) {
  const url = normalize(value);
  if (!url || !current) return;
  $('#status').textContent = 'Cargando…';
  current.wv.loadURL(url);
}

function goHome() {
  if (!current) return;
  current.wv.loadURL(S.home ? normalize(S.home) : newTabURL(current.privateMode));
}

function toggleBookmark() {
  if (!current) return;
  const url = current.wv.getURL();
  if (!url || isInternal(url)) return;
  const i = S.bookmarks.findIndex(m => m.url === url);
  if (i >= 0) { S.bookmarks.splice(i, 1); toast('Eliminado de favoritos'); }
  else { const title = window.prompt('Nombre del favorito:', current.title || url); if (title === null) return; S.bookmarks.unshift({ title: title.trim() || url, url, time: Date.now() }); S.bookmarks = S.bookmarks.slice(0, 200); toast('Añadido a favoritos'); }
  save(); updateAddress(); if (panel === 'bookmarks') renderPanel();
}

function applyMod(wv, key, enabled) {
  const css = MODS[key]?.[1];
  if (!css) return;
  const id = `nova-mod-${key}`;
  wv.executeJavaScript(`(()=>{let s=document.getElementById(${JSON.stringify(id)});if(${enabled}){if(!s){s=document.createElement('style');s.id=${JSON.stringify(id)};s.textContent=${JSON.stringify(css)};document.head.appendChild(s)}}else if(s)s.remove()})()`).catch(() => {});
}

function setPanel(name) {
  panel = panel === name ? null : name;
  $$('.sidebtn').forEach(b => b.classList.toggle('active', b.dataset.panel === panel));
  $('#sidepanel').classList.toggle('open', !!panel);
  renderPanel();
}


function exportBookmarksHTML() {
  const rows = (S.bookmarks||[]).map(b => `<DT><A HREF="${esc(b.url)}" ADD_DATE="${Math.floor((b.time||Date.now())/1000)}">${esc(b.title||b.url)}</A>`).join('\n');
  const html = `<!DOCTYPE NETSCAPE-Bookmark-file-1>\n<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">\n<TITLE>Nova Bookmarks</TITLE>\n<H1>Nova Bookmarks</H1>\n<DL><p>\n${rows}\n</DL><p>`;
  const f=path.join(os.homedir(),'Downloads','Nova-Favoritos.html'); fs.writeFileSync(f,html,'utf8'); toast('Favoritos exportados en Descargas');
}
function importBookmarksHTML(e) {
  const file=e.target.files?.[0]; if(!file) return;
  const r=new FileReader(); r.onload=()=>{
    try {
      const doc=new DOMParser().parseFromString(String(r.result),'text/html');
      const found=[...doc.querySelectorAll('a[href]')].map(a=>({title:(a.textContent||a.href).trim(),url:a.href,time:Date.now()})).filter(x=>/^https?:/i.test(x.url));
      const map=new Map((S.bookmarks||[]).map(x=>[x.url,x])); found.forEach(x=>map.set(x.url,x)); S.bookmarks=[...map.values()].slice(0,500); save(); renderPanel(); toast(`${found.length} favoritos importados`);
    } catch { toast('Archivo de favoritos no válido'); }
  }; r.readAsText(file);
}

function renderPanel() {
  if (!panel) return;
  const p = $('#panel-content');
  if (panel === 'home') {
    p.innerHTML = `<div class="panel-head"><div><span class="eyebrow">NOVA</span><h2>Centro</h2></div><span class="mut">${tabs.length} pestañas</span></div>
      <div class="panel-grid"><button class="card-btn" data-act="new"><b>Nueva pestaña</b><span>Ctrl+T</span></button><button class="card-btn" data-act="private"><b>Privada</b><span>Ctrl+Shift+N</span></button><button class="card-btn" data-act="closed"><b>Reabrir</b><span>Ctrl+Shift+T</span></button><button class="card-btn" data-act="clear"><b>Limpiar datos</b><span>Cookies + caché</span></button></div><div class="nova-stats"><div><b>${tabs.length}</b><span>Pestañas</span></div><div><b>${(S.bookmarks||[]).length}</b><span>Favoritos</span></div><div><b>${(S.history||[]).length}</b><span>Historial</span></div></div>
      <div class="section"><h3>Acceso rápido</h3><div class="quick-grid">${[['YouTube','https://youtube.com'],['GitHub','https://github.com'],['Wikipedia','https://wikipedia.org'],['Steam','https://store.steampowered.com'],['Discord','https://discord.com'],['Reddit','https://reddit.com']].map(([n,u])=>`<button class="quick" data-url="${u}">${n}</button>`).join('')}</div></div>`;
    p.onclick = e => {
      const b = e.target.closest('[data-url]'); if (b) createTab(b.dataset.url);
      const a = e.target.closest('[data-act]'); if (!a) return;
      if (a.dataset.act === 'new') createTab();
      if (a.dataset.act === 'private') createTab(newTabURL(true), true);
      if (a.dataset.act === 'closed') reopenClosed();
      if (a.dataset.act === 'clear') clearData();
    };
  }
  if (panel === 'bookmarks') {
    p.innerHTML = `<div class="panel-head"><div><span class="eyebrow">BIBLIOTECA</span><h2>Favoritos</h2></div><div class="tool-row"><button class="btn-mini" id="sortmarks">↕ Ordenar</button><button class="btn-mini" id="exportmarks">Exportar</button><label class="btn-mini">Importar<input hidden type="file" id="importmarks" accept=".html,.htm"></label></div></div>
      <input class="field" id="markq" placeholder="Buscar favoritos…">
      <div class="list" id="marklist"></div>`;
    const draw = () => { const q = $('#markq').value.toLowerCase(); $('#marklist').innerHTML = S.bookmarks.filter(m => `${m.title} ${m.url}`.toLowerCase().includes(q)).map((m, i) => `<div class="list-item"><button class="list-main" data-url="${esc(m.url)}"><b>${esc(m.title || m.url)}</b><span>${esc(m.url)}</span></button><button class="xbtn" data-remove="${i}">×</button></div>`).join('') || '<div class="empty">No hay favoritos todavía.</div>'; };
    draw();
    $('#markq').oninput = draw;
    p.querySelector('#sortmarks').onclick = () => { S.bookmarks.sort((a,b) => String(a.title).localeCompare(String(b.title))); save(); draw(); };
    p.querySelector('#exportmarks').onclick = exportBookmarksHTML;
    p.querySelector('#importmarks').onchange = importBookmarksHTML;
    p.onclick = e => { const b = e.target.closest('[data-url]'); if (b) current.wv.loadURL(b.dataset.url); const x = e.target.closest('[data-remove]'); if (x) { S.bookmarks.splice(+x.dataset.remove,1); save(); draw(); updateAddress(); } };
  }
  if (panel === 'history') {
    p.innerHTML = `<div class="panel-head"><div><span class="eyebrow">BIBLIOTECA</span><h2>Historial</h2></div><button class="btn-mini" id="clearhist">Borrar todo</button></div><input class="field" id="histq" placeholder="Buscar historial…"><div class="list" id="histlist"></div>`;
    const draw = () => { const q = $('#histq').value.toLowerCase(); $('#histlist').innerHTML = (S.history || []).filter(h => `${h.title} ${h.url}`.toLowerCase().includes(q)).map((h,i) => `<div class="list-item"><button class="list-main" data-url="${esc(h.url)}"><b>${esc(h.title || h.url)}</b><span>${new Date(h.time).toLocaleString('es-ES', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'})} · ${esc(h.url)}</span></button><button class="xbtn" data-remove="${i}">×</button></div>`).join('') || '<div class="empty">Todavía no hay historial.</div>'; };
    draw(); $('#histq').oninput = draw; $('#clearhist').onclick = () => { S.history = []; save(); draw(); toast('Historial borrado'); };
    p.onclick = e => { const b=e.target.closest('[data-url]'); if (b) createTab(b.dataset.url); const x=e.target.closest('[data-remove]'); if(x){S.history.splice(+x.dataset.remove,1);save();draw();} };
  }
  if (panel === 'downloads') {
    p.innerHTML = `<div class="panel-head"><div><span class="eyebrow">BIBLIOTECA</span><h2>Descargas</h2></div><button class="btn-mini" id="cleardl">Limpiar</button></div><div class="list" id="dllist"></div>`;
    const render = () => $('#dllist').innerHTML = downloads.slice().reverse().map(d => `<div class="download-item"><div class="download-top"><b>${esc(d.name)}</b><span>${d.privateMode ? 'Privada' : ''}</span></div><div class="progress"><i style="width:${d.total>0?Math.min(100,(d.received/d.total)*100):100}%"></i></div><div class="download-meta"><span>${d.state || 'progresando'} · ${d.total ? `${Math.round(d.received/1024)} KB / ${Math.round(d.total/1024)} KB` : ''}</span><span>${d.state==='progressing' ? `<button class="linkbtn" data-dl="${d.id}" data-da="${d.paused?'resume':'pause'}">${d.paused?'Reanudar':'Pausar'}</button>` : ''} <button class="linkbtn" data-open="${esc(d.path)}">Abrir</button> <button class="linkbtn" data-show="${esc(d.path)}">Carpeta</button></span></div></div>`).join('') || '<div class="empty">No has descargado nada todavía.</div>';
    render();
    $('#cleardl').onclick = () => { downloads=[]; S.downloads=[]; save(); render(); };
    p.onclick = e => { const o=e.target.closest('[data-open]'); if(o) ipc.invoke('open-path', o.dataset.open); const s=e.target.closest('[data-show]'); if(s) ipc.invoke('show-item', s.dataset.show); const c=e.target.closest('[data-dl]'); if(c) ipc.invoke('download-control', c.dataset.dl, c.dataset.da); };
  }
  if (panel === 'notes') {
    p.innerHTML = `<div class="panel-head"><div><span class="eyebrow">UTILIDAD</span><h2>Notas rápidas</h2></div><button class="btn-mini" id="clearnote">Limpiar</button></div><textarea id="notes" class="notes" placeholder="Ideas, enlaces, recordatorios…">${esc(S.notes || '')}</textarea><div class="mut">Se guarda automáticamente en este PC.</div>`;
    $('#notes').oninput = e => { S.notes = e.target.value; save(); };
    $('#clearnote').onclick = () => { S.notes=''; save(); $('#notes').value=''; };
  }
  if (panel === 'tools') {
    p.innerHTML = `<div class="panel-head"><div><span class="eyebrow">NOVA LAB</span><h2>Herramientas</h2></div></div>
      <div class="tool-card"><b>Calculadora</b><div class="calc"><input id="calc" readonly value="0"><div class="calc-grid">${['7','8','9','÷','4','5','6','×','1','2','3','−','C','0','=','+'].map(x=>`<button data-calc="${x}">${x}</button>`).join('')}</div></div></div>
      <div class="tool-card"><b>Acciones rápidas</b><div class="tool-row"><button class="btn" id="toolshot">Captura PNG</button><button class="btn" id="toolpage">Guardar HTML</button><button class="btn" id="tooldev">DevTools</button></div></div>
      <div class="tool-card"><b>Atajos</b><div class="shortcut-list"><span>Ctrl+T</span><b>Nueva pestaña</b><span>Ctrl+Tab</span><b>Siguiente pestaña</b><span>Ctrl+Shift+N</span><b>Pestaña privada</b><span>Ctrl+Shift+T</span><b>Reabrir pestaña</b><span>Ctrl+K</span><b>Paleta de comandos</b><span>Ctrl+J</span><b>Descargas</b><span>Ctrl+H</span><b>Historial</b><span>Ctrl+Shift+Delete</span><b>Limpiar datos</b><span>F11</span><b>Pantalla completa</b></div></div>`;
    $('#toolshot').onclick=capturePage; $('#toolpage').onclick=savePage; $('#tooldev').onclick=()=>current?.wv.openDevTools();
    let calc = '0';
    p.querySelectorAll('[data-calc]').forEach(b => b.onclick = () => { const v=b.dataset.calc; if(v==='C') calc='0'; else if(v==='='){ try{calc=String(Function(`return ${calc.replaceAll('×','*').replaceAll('÷','/') .replaceAll('−','-')}`)());}catch{calc='Error';} } else calc = calc==='0'||calc==='Error' ? v : calc+v; $('#calc').value=calc; });
  }
  if (panel === 'settings') renderSettings(p);
}

function renderSettings(p) {
  p.innerHTML = `<div class="panel-head"><div><span class="eyebrow">PERSONALIZACIÓN</span><h2>Ajustes</h2></div></div>
    <div class="settings-grid">
      <label>Nombre<input class="field" id="set-name" value="${esc(S.name)}" placeholder="Tu nombre"></label>
      <label>Buscador<select class="field" id="set-search">${Object.values(SEARCHERS).map(([n,u])=>`<option value="${u}">${n}</option>`).join('')}</select></label>
      <label>Página de inicio<input class="field" id="set-home" value="${esc(S.home)}" placeholder="Vacío = Nova"></label>
      <label>Color de acento<input class="field" id="set-accent" value="${esc(S.accent)}" placeholder="#8b5cf6"></label>
      <div class="settings-box"><b>Tema</b><div class="theme-row">${Object.entries(THEMES).map(([k,n])=>`<button class="theme-pill ${S.theme===k?'on':''}" data-theme="${k}">${n}</button>`).join('')}</div></div>
      <div class="settings-box"><b>Privacidad</b><div class="toggle-row"><span>Bloqueador de anuncios</span><button class="switch ${S.adblock?'on':''}" data-toggle="adblock"></button></div><div class="toggle-row"><span>Animaciones</span><button class="switch ${S.anim?'on':''}" data-toggle="anim"></button></div></div>
      <div class="settings-box"><b>Comportamiento</b><div class="toggle-row"><span>Abrir pestaña nueva al iniciar</span><button class="switch ${S.showNewTab?'on':''}" data-toggle="showNewTab"></button></div><div class="toggle-row"><span>Restaurar última sesión</span><button class="switch ${S.restoreTabs?'on':''}" data-toggle="restoreTabs"></button></div></div>
      <div class="settings-box"><b>Herramientas</b><div class="tool-row"><button class="btn" id="pickwall">Añadir fondo</button><button class="btn" id="clearcache">Limpiar datos</button><button class="btn" id="capturecfg">Captura</button><button class="btn" id="savepagecfg">Guardar página</button><button class="btn" id="exportcfg">Exportar</button><label class="btn">Importar<input hidden type="file" id="importcfg" accept=".json"></label></div></div>
    </div>`;
  $('#set-search').value = S.search; $('#set-name').oninput = e => {S.name=e.target.value;save();refreshNewTabs();};
  $('#set-search').onchange = e => {S.search=e.target.value;save();}; $('#set-home').onchange=e=>{S.home=e.target.value.trim();save();}; $('#set-accent').onchange=e=>{S.accent=e.target.value.trim();save();applyTheme();};
  $$('.theme-pill', p).forEach(b=>b.onclick=()=>{S.theme=b.dataset.theme;save();applyTheme();refreshNewTabs();renderSettings(p);});
  $$('.switch', p).forEach(b=>b.onclick=()=>{const k=b.dataset.toggle;S[k]=!S[k];save();if(k==='adblock')ipc.invoke('adblock',S.adblock);applyTheme();renderSettings(p);});
  $('#pickwall').onclick=async()=>{await ipc.invoke('pick-wp', S.wallSection); toast('Fondos añadidos');};
  $('#clearcache').onclick=clearData;
  $('#capturecfg').onclick=()=>capturePage();
  $('#savepagecfg').onclick=()=>savePage();
  $('#exportcfg').onclick=()=>{const f=path.join(os.homedir(),'Downloads','nova-ajustes.json');fs.writeFileSync(f,JSON.stringify(S,null,2));toast('Ajustes exportados');};
  $('#importcfg').onchange=e=>{const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{Object.assign(S,JSON.parse(r.result));save();applyTheme();refreshNewTabs();renderSettings(p);toast('Ajustes importados');}catch{toast('Archivo no válido');}};r.readAsText(file)};
}

async function clearData() { await ipc.invoke('clear'); S.history=[]; save(); toast('Cookies, caché e historial local limpiados'); }
function refreshNewTabs() { tabs.filter(t=>isInternal(t.wv.getURL())).forEach(t=>t.wv.loadURL(newTabURL(t.privateMode))); }

async function savePDF() {
  if (!current) return;
  try { const f = await ipc.invoke('print-pdf', current.wv.getWebContentsId()); toast('PDF guardado en '+f); } catch(e) { toast('No se pudo crear el PDF: '+e.message); }
}

function openFind() { $('#findbar').classList.add('open'); $('#findinput').focus(); $('#findinput').select(); }
function doFind() { if(!current)return; current.wv.findInPage($('#findinput').value, { forward:true, findNext:true }); }


async function capturePage() {
  if (!current) return;
  try { const f = await ipc.invoke('capture-page', current.wv.getWebContentsId()); toast('Captura guardada en ' + f); }
  catch (e) { toast('No se pudo capturar la página: ' + e.message); }
}
async function savePage() {
  if (!current) return;
  try { const f = await ipc.invoke('save-page', current.wv.getWebContentsId()); if (f) toast('Página guardada en ' + f); }
  catch (e) { toast('No se pudo guardar la página: ' + e.message); }
}
function switchTab(delta) {
  if (!tabs.length || !current) return;
  const i = tabs.indexOf(current);
  selectTab(tabs[(i + delta + tabs.length) % tabs.length]);
}
function closeOthers(tab) {
  tabs.slice().forEach(t => { if (t !== tab && !t.pinned) closeTab(t, false); });
  saveSession();
}
function closeRight(tab) {
  const i = tabs.indexOf(tab);
  tabs.slice(i + 1).forEach(t => { if (!t.pinned) closeTab(t, false); });
  saveSession();
}
function addressSuggestions(query) {
  const box = $('#address-suggestions');
  if (!query.trim()) { box.classList.add('hidden'); box.innerHTML=''; return; }
  const all = [...(S.bookmarks||[]).map(x=>({...x,type:'★ Favorito'})), ...(S.history||[]).map(x=>({...x,type:'Historial'}))];
  const q=query.toLowerCase();
  const items=all.filter(x=>`${x.title} ${x.url}`.toLowerCase().includes(q)).slice(0,7);
  box.innerHTML=items.length ? items.map(x=>`<button data-surl="${esc(x.url)}"><b>${esc(x.title||x.url)}</b><span>${esc(x.type)} · ${esc(x.url)}</span></button>`).join('') : `<div class="suggestion-empty">Pulsa Enter para buscar «${esc(query)}»</div>`;
  box.classList.remove('hidden');
  box.querySelectorAll('[data-surl]').forEach(b=>b.onclick=()=>{ $('#address').value=b.dataset.surl; navigate(b.dataset.surl); box.classList.add('hidden'); });
}

function toast(message) { const d=document.createElement('div'); d.className='toast'; d.textContent=message; $('#toast-stack').appendChild(d); setTimeout(()=>d.remove(),2800); }

const COMMANDS = [
  ['Nueva pestaña', 'Ctrl+T', () => createTab()],
  ['Nueva pestaña privada', 'Ctrl+Shift+N', () => createTab(newTabURL(true), true)],
  ['Reabrir pestaña cerrada', 'Ctrl+Shift+T', reopenClosed],
  ['Duplicar pestaña', '', () => duplicateTab(current)],
  ['Fijar / desfijar pestaña', '', () => toggleTabPin(current)],
  ['Silenciar pestaña', '', () => toggleTabMute(current)],
  ['Favorito actual', 'Ctrl+D', toggleBookmark],
  ['Descargas', 'Ctrl+J', () => setPanel('downloads')],
  ['Historial', 'Ctrl+H', () => setPanel('history')],
  ['Favoritos', 'Ctrl+B', () => setPanel('bookmarks')],
  ['Configuración', 'Ctrl+,', () => setPanel('settings')],
  ['Buscar en página', 'Ctrl+F', openFind],
  ['Guardar página como HTML', '', savePage],
  ['Guardar página como PDF', 'Ctrl+Shift+P', savePDF],
  ['Capturar página como PNG', '', capturePage],
  ['Modo lectura', '', () => toggleCurrentMod('reader')],
  ['Oscuro forzado', '', () => toggleCurrentMod('dark')],
  ['Sin animaciones web', '', () => toggleCurrentMod('noanim')],
  ['Texto grande', '', () => toggleCurrentMod('large')],
  ['Herramientas', '', () => setPanel('tools')],
  ['Inicio', 'Alt+Home', goHome],
  ['Pantalla completa', 'F11', () => ipc.invoke('fullscreen')],
  ['Desarrollador', 'Ctrl+Shift+I', () => current?.wv.openDevTools()]
];
function palette() { $('#command-palette').classList.remove('hidden'); $('#command-search').value=''; renderCommands(''); $('#command-search').focus(); }
function renderCommands(q) { const list=$('#command-list'); const items=COMMANDS.filter(c=>`${c[0]} ${c[1]}`.toLowerCase().includes(q.toLowerCase())); list.innerHTML=items.map((c,i)=>`<button class="command" data-ci="${i}"><span>${c[0]}</span><small>${c[1]}</small></button>`).join(''); list.onclick=e=>{const b=e.target.closest('[data-ci]');if(!b)return; const c=items[+b.dataset.ci]; $('#command-palette').classList.add('hidden'); c[2]();}; }

$('#command-search').oninput=e=>renderCommands(e.target.value);
$('#command-palette').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.add('hidden');};
$('#menu-btn').onclick=palette;
$('#newtab').onclick=()=>createTab();
$('#private-tab').onclick=()=>createTab(newTabURL(true),true);
$('#back').onclick=()=>current?.wv.canGoBack()&&current.wv.goBack();
$('#forward').onclick=()=>current?.wv.canGoForward()&&current.wv.goForward();
$('#reload').onclick=()=>current?.wv.reload();
$('#home').onclick=goHome;
$('#bookmark').onclick=toggleBookmark;
$('#printbtn').onclick=savePDF;
$('#findbtn').onclick=openFind;
$('#findclose').onclick=()=>{$('#findbar').classList.remove('open');current?.wv.stopFindInPage('clearSelection');};
$('#findinput').oninput=doFind; $('#findnext').onclick=doFind; $('#findprev').onclick=()=>current?.wv.findInPage($('#findinput').value,{forward:false,findNext:true});
$('#clear-address').onclick=()=>{$('#address').value='';$('#address').focus();};
$('#address').onkeydown=e=>{if(e.key==='Enter'){navigate(e.target.value);$('#address-suggestions').classList.add('hidden');} if(e.key==='Escape'){updateAddress();$('#address-suggestions').classList.add('hidden');}}; $('#address').onfocus=e=>{e.target.select();addressSuggestions(e.target.value)}; $('#address').oninput=e=>addressSuggestions(e.target.value);

$$('[data-win]').forEach(b=>b.onclick=()=>ipc.send('win',b.dataset.win));
$$('.sidebtn[data-panel]').forEach(b=>b.onclick=()=>setPanel(b.dataset.panel));
$('#privacy-badge').onclick=()=>setPanel('settings');
$('#tab-menu').onclick=e=>{ const b=e.target.closest('[data-tab-action]'); if(!b||!contextTab)return; const a=b.dataset.tabAction; if(a==='new') createTab(newTabURL(contextTab.privateMode), contextTab.privateMode); if(a==='duplicate') duplicateTab(contextTab); if(a==='pin') toggleTabPin(contextTab); if(a==='mute') toggleTabMute(contextTab); if(a==='close') closeTab(contextTab); if(a==='close-others') closeOthers(contextTab); if(a==='close-right') closeRight(contextTab); hideTabMenu(); };
document.addEventListener('click', e=>{ if(!e.target.closest('#tab-menu')) hideTabMenu(); if(!e.target.closest('#address-wrap')) $('#address-suggestions').classList.add('hidden'); });


ipc.on('open-tab', (_e,url)=>createTab(url));
ipc.on('context-action', (_e,action)=>{
  if(action==='back')$('#back').click(); if(action==='forward')$('#forward').click(); if(action==='reload')$('#reload').click();
  if(action==='print')savePDF(); if(action==='save-page')savePage(); if(action==='capture')capturePage(); if(action==='find')openFind(); if(action==='devtools') current?.wv.openDevTools();
});
ipc.on('blocked',()=>{blocked++;$('#blocked-count').textContent=`${blocked.toLocaleString('es-ES')} bloqueados`;});
ipc.on('download',(_e,d)=>{const i=downloads.findIndex(x=>x.id===d.id); if(i>=0)downloads[i]=d; else downloads.push(d); downloads=downloads.slice(-50); S.downloads=downloads; save(); if(panel==='downloads')renderPanel(); ipc.invoke('set-badge', downloads.filter(x=>x.state==='progressing').length);});

document.addEventListener('keydown', e => {
  if(e.key==='F11'){e.preventDefault();ipc.invoke('fullscreen');return;}
  if(e.ctrlKey && e.shiftKey && e.key.toLowerCase()==='w'){e.preventDefault();ipc.send('win','close');return;}
  if(e.ctrlKey && e.key==='PageUp'){e.preventDefault();switchTab(-1);return;}
  if(e.ctrlKey && e.key==='PageDown'){e.preventDefault();switchTab(1);return;}
  if(e.ctrlKey && e.shiftKey && e.key==='Tab'){e.preventDefault();switchTab(-1);return;}
  if(e.ctrlKey && !e.shiftKey && e.key==='Tab'){e.preventDefault();switchTab(1);return;}
  if(e.ctrlKey && e.shiftKey && e.key.toLowerCase()==='delete'){e.preventDefault();clearData();return;}
  if(e.ctrlKey && e.shiftKey && e.key.toLowerCase()==='i'){e.preventDefault();current?.wv.openDevTools();return;}
  if(e.ctrlKey && !e.shiftKey && /^[1-9]$/.test(e.key)){e.preventDefault();const i=Math.min(Number(e.key)-1,tabs.length-1);if(i>=0)selectTab(tabs[i]);return;}
  if(e.ctrlKey && !e.shiftKey && e.key.toLowerCase()==='t'){e.preventDefault();createTab();}
  else if(e.ctrlKey && e.shiftKey && e.key.toLowerCase()==='t'){e.preventDefault();reopenClosed();}
  else if(e.ctrlKey && e.shiftKey && e.key.toLowerCase()==='n'){e.preventDefault();createTab(newTabURL(true),true);}
  else if(e.ctrlKey && e.key.toLowerCase()==='w'){e.preventDefault();closeTab(current);}
  else if(e.ctrlKey && e.key.toLowerCase()==='l'){e.preventDefault();$('#address').focus();}
  else if(e.ctrlKey && e.key.toLowerCase()==='d'){e.preventDefault();toggleBookmark();}
  else if(e.ctrlKey && e.key.toLowerCase()==='f'){e.preventDefault();openFind();}
  else if(e.ctrlKey && e.key.toLowerCase()==='j'){e.preventDefault();setPanel('downloads');}
  else if(e.ctrlKey && e.key.toLowerCase()==='h'){e.preventDefault();setPanel('history');}
  else if(e.ctrlKey && e.key.toLowerCase()==='b'){e.preventDefault();setPanel('bookmarks');}
  else if(e.ctrlKey && e.key.toLowerCase()==='k'){e.preventDefault();palette();}
  else if(e.ctrlKey && e.key==='+'){e.preventDefault();S.zoom=Math.min(2,S.zoom+0.1);current?.wv.setZoomFactor(S.zoom);save();toast(`Zoom ${Math.round(S.zoom*100)}%`);}
  else if(e.ctrlKey && e.key==='-'){e.preventDefault();S.zoom=Math.max(.5,S.zoom-0.1);current?.wv.setZoomFactor(S.zoom);save();toast(`Zoom ${Math.round(S.zoom*100)}%`);}
  else if(e.ctrlKey && e.key==='0'){e.preventDefault();S.zoom=1;current?.wv.setZoomFactor(1);save();toast('Zoom 100%');}
  else if(e.altKey && e.key==='ArrowLeft'){$('#back').click();}
  else if(e.altKey && e.key==='ArrowRight'){$('#forward').click();}
  else if(e.altKey && e.key==='Home'){e.preventDefault();goHome();}
  else if(e.key==='Escape'){$('#command-palette').classList.add('hidden');$('#findbar').classList.remove('open');}
  else if(e.ctrlKey && e.key===','){e.preventDefault();setPanel('settings');}
});

applyTheme();
(async()=>{
  if(!localStorage.nova){const cfg=await ipc.invoke('install-cfg');Object.assign(S,cfg);save();}
  let restored = false;
  if(S.restoreTabs && Array.isArray(S.openTabs) && S.openTabs.length){
    S.openTabs.slice(0, 16).forEach((info, i)=>{ const t=createTab(info.url,false,i===0); t.pinned=!!info.pinned; t.el.classList.toggle('pinned',t.pinned); $('.tab-title',t.el).style.display=t.pinned?'none':''; });
    if(tabs[0]) selectTab(tabs[0]); restored=true;
  }
  if(!restored && S.showNewTab !== false) createTab();
  if(!tabs.length) createTab();
  window.addEventListener('beforeunload',saveSession);
  window.addEventListener('blur',hideTabMenu);
})();
</script>
</body>
</html>
