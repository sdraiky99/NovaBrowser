<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob:; object-src 'none'; base-uri 'none'; frame-src 'self' file:; img-src 'self' file: data: blob: https:; style-src 'self' 'unsafe-inline' file:; script-src 'self' 'unsafe-inline' file:; connect-src 'self' https:">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Next-Gen</title>
<link rel="icon" href="../assets/brand/nova-icon.png">
<link rel="stylesheet" href="nova.css">
</head>
<body>
<div id="app">
  <header id="windowbar" aria-label="Barra de pestañas">
    <div id="brand" title="Nova"><img src="../assets/brand/nova-icon.png" alt="Nova"><span>Nova</span></div>
    <div id="tabs" aria-label="Pestañas">
      <button id="newTab" class="icon-btn tab-add" title="Nueva pestaña (Ctrl+T)" aria-label="Nueva pestaña">+</button>
    </div>
    <div id="windowActions" aria-label="Ventana">
      <button class="window-btn" data-window="min" title="Minimizar" aria-label="Minimizar"><svg viewBox="0 0 10 1" aria-hidden="true"><path d="M1 .5H9"/></svg></button>
      <button class="window-btn" data-window="max" title="Maximizar" aria-label="Maximizar"><svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1.2" y="1.2" width="7.6" height="7.6"/></svg></button>
      <button class="window-btn close" data-window="close" title="Cerrar" aria-label="Cerrar"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1 9 9M9 1 1 9"/></svg></button>
    </div>
  </header>
  <div id="toolbar" aria-label="Navegación">
    <div class="nav-group">
      <button class="icon-btn nav-btn" id="back" title="Atrás" aria-label="Atrás"></button>
      <button class="icon-btn nav-btn" id="forward" title="Adelante" aria-label="Adelante"></button>
      <button class="icon-btn nav-btn" id="reload" title="Recargar" aria-label="Recargar"></button>
    </div>
    <div id="addressWrap">
      <span id="secureMark" aria-hidden="true">○</span>
      <input id="address" autocomplete="off" spellcheck="false" placeholder="Buscar o escribir una dirección" aria-label="Dirección o búsqueda"><div id="addressSuggestions" class="address-suggestions" aria-hidden="true"></div>
      <button id="star" class="icon-btn address-action" title="Añadir a favoritos" aria-label="Añadir a favoritos"></button>
    </div>
    <div class="toolbar-actions">
      <button class="icon-btn nav-btn" id="accentButton" title="Color de acento" aria-label="Color de acento"><span class="accent-dot"></span></button>
      <button class="icon-btn nav-btn" id="menuButton" title="Menú" aria-label="Menú"></button>
    </div>
  </div>
  <div id="workspace">
    <aside id="sidebar" aria-label="Navegación de Nova">
      <button class="side-item active" data-view="home" title="Inicio"><span class="sicon" data-icon="home"></span><span>Inicio</span></button>
      <button class="side-item" data-view="favorites" title="Favoritos"><span class="sicon" data-icon="star"></span><span>Favoritos</span></button>
      <button class="side-item" data-view="workspaces" title="Workspaces"><span class="sicon" data-icon="grid"></span><span>Workspaces</span></button>
      <button class="side-item" data-view="history" title="Historial"><span class="sicon" data-icon="history"></span><span>Historial</span></button>
      <button class="side-item" data-view="downloads" title="Descargas"><span class="sicon" data-icon="download"></span><span>Descargas</span></button>
      <button class="side-item" data-view="extensions" title="Extensiones"><span class="sicon" data-icon="extensions"></span><span>Extensiones</span></button>
      <button class="side-item" data-view="performance" title="Rendimiento"><span class="sicon" data-icon="bolt"></span><span>Rendimiento</span></button>
      <div class="side-spacer"></div>
      <button class="side-item" data-view="settings" title="Ajustes"><span class="sicon" data-icon="settings"></span><span>Ajustes</span></button>
    </aside>
    <main id="browserArea"><div id="views"></div></main>
  </div>
</div>
<div id="drawer" aria-hidden="true"></div>
<div id="toastStack" aria-live="polite"></div>
<script src="nova.js"></script>
</body>
</html>
