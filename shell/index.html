<style>

const P={back:'M15 6l-6 6 6 6',fwd:'M9 6l6 6-6 6',rl:'M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',
mods:'M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4',walls:'M4 5h16v14H4zM4 16l4-4 4 4 3-3 5 5',marks:'M6 3h12v18l-6-4-6 4z',set:'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2',
cam:'M4 8h4l2-3h4l2 3h4v11H4zM12 11a3 3 0 1 0 0 6 3 3 0 0 0 0-6',plus:'M12 5v14M5 12h14',x:'M6 6l12 12M18 6L6 18',min:'M5 18h14',max:'M5 5h14v14H5z',hist:'M12 7v5l3 2M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4'};
const ic=n=>`<svg viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const AI=`<svg viewBox="0 0 32 32"><defs><linearGradient id="ng" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f43f5e"/></linearGradient></defs><ellipse cx="16" cy="16" rx="14.5" ry="5.5" fill="none" stroke="url(#ng)" stroke-width="1.2" transform="rotate(-25 16 16)"/><path d="M16 2l3.2 10.8L30 16l-10.8 3.2L16 30l-3.2-10.8L2 16l10.8-3.2z" fill="url(#ng)"/><circle cx="16" cy="16" r="2.6" fill="#fff"/></svg>`;
[['bk','back'],['fw','fwd'],['rl','rl'],['st','star'],['sh','cam'],['nt','plus']].forEach(([i,n])=>$('#'+i).innerHTML=ic(n));
document.querySelectorAll('[data-w]').forEach(b=>{b.innerHTML=ic({min:'min',max:'max',close:'x'}[b.dataset.w]);b.onclick=()=>ipc.send('win',b.dataset.w)});

const ud=ipc.sendSync('userdata'),NOVA_VER=ipc.sendSync('app-version');
let STORED={};try{STORED=JSON.parse(localStorage.nova||'{}')||{}}catch{try{localStorage.removeItem('nova')}catch{}};const S=Object.assign({theme:'air',search:'https://duckduckgo.com/?q=',adblock:true,anim:true,sec:'videojuegos',wp:'',marks:[],key:'',mods:{},memSave:false,bmbar:false,newTabLinks:false},STORED);
const save=()=>localStorage.nova=JSON.stringify(S);
const tabAdd=$('#nt');
const keepTabAddAtEnd=()=>{if(tabAdd&&tabAdd.parentNode!==$('#tabs'))$('#tabs').appendChild(tabAdd); else if(tabAdd&&$('#tabs').lastElementChild!==tabAdd)$('#tabs').appendChild(tabAdd)};
keepTabAddAtEnd();
const THEMES={air:'Air',nova:'Nova',win95:'Windows 95',code:'Código',undertale:'Undertale',aero:'Aero'};
const SECS={coches:'Coches',videojuegos:'Videojuegos',codigo:'Código'};
const MODS={dark:['Modo oscuro forzado','html{filter:invert(1) hue-rotate(180deg)}img,video,picture{filter:invert(1) hue-rotate(180deg)}'],
reader:['Modo lectura','header,nav,aside,footer,[class*=ad-],[id*=banner]{display:none!important}body{max-width:720px!important;margin:auto!important;font:18px/1.7 Georgia,serif!important}'],
noanim:['Sin animaciones web','*{animation:none!important;transition:none!important;scroll-behavior:auto!important}'],
zoom:['Texto grande','html{zoom:1.2}']};
function applyTheme(){document.body.className='t-'+S.theme+(S.anim?'':' noanim');ipc.invoke('adblock',S.adblock)}

/* ---- Tabs ---- */
let tabs=[],cur=null;
const TAB_ADD=tabAdd;
const profilePartition=()=>window.NOVA_PROFILE_PARTITION?window.NOVA_PROFILE_PARTITION():`persist:nova-profile-${String(S.activeProfile||'default').replace(/[^a-z0-9_-]/gi,'').slice(0,32)||'default'}`;
const NT=()=>pathToFileURL(path.join(__dirname,'newtab.html')).href+'?l='+encodeURIComponent(S.logo||'classic')+'&t='+S.theme+'&s='+encodeURIComponent(S.search)+'&n='+encodeURIComponent(S.name||'')+'&a='+encodeURIComponent(S.acc||'')+'&b='+encodeURIComponent(JSON.stringify((S.marks||[]).slice(0,8)))+'&d='+encodeURIComponent(JSON.stringify(S.dash||{}))+'&r='+encodeURIComponent(JSON.stringify((S.hist||[]).slice(0,6).map(x=>({u:x.u,t:x.t}))))+'&x='+encodeURIComponent(JSON.stringify(S.quick||[]))+'&nd='+((S.dls||[]).length)+(S.wp?'&wp='+encodeURIComponent(pathToFileURL(S.wp).href):'');
const isNT=u=>u&&u.includes('newtab.html');
function newTab(u){
  const wv=document.createElement('webview');wv.setAttribute('partition',profilePartition());wv.src=u||NT();$('#view').appendChild(wv);
  const el=document.createElement('div');el.className='tab';el.innerHTML='<img src="../assets/icon.png"><span>Nueva pestaña</span><button class="ib sm">'+ic('x')+'</button>';
  const t={wv,el};tabs.push(t);$('#tabs').insertBefore(el,TAB_ADD);keepTabAddAtEnd();
  el.onmousedown=e=>{if(e.button===1)closeTab(t)};el.onclick=e=>{if(e.target.closest('button'))closeTab(t);else sel(t)};
  const up=()=>{if(cur===t){const x=wv.getURL?.call(wv)||'';$('#addr').value=isNT(x)?'':x;$('#st').style.color=S.marks.some(m=>m.u===x)?'var(--acc)':''}};
  wv.addEventListener('page-title-updated',e=>el.querySelector('span').textContent=e.title);
  wv.addEventListener('page-favicon-updated',e=>el.querySelector('img').src=e.favicons[0]);
  wv.addEventListener('did-start-loading',()=>el.classList.add('ld'));wv.addEventListener('did-stop-loading',()=>{el.classList.remove('ld');up()});
  wv.addEventListener('did-navigate',()=>{if(isNT(wv.getURL()))el.querySelector('img').src='../assets/icon.png';up()});
  wv.addEventListener('did-navigate-in-page',up);
  wv.addEventListener('dom-ready',()=>{Object.keys(S.mods).forEach(k=>S.mods[k]&&mod(wv,k,true))});
  sel(t);return t;
}
function sel(t){cur=t;tabs.forEach(x=>{x.el.classList.toggle('on',x===t);x.wv.classList.toggle('on',x===t)});try{const u=t.wv.getURL();$('#addr').value=isNT(u)?'':u}catch{$('#addr').value=''}}
function closeTab(t){const i=tabs.indexOf(t);t.wv.remove();t.el.remove();tabs.splice(i,1);if(!tabs.length)return ipc.send('win','close');if(cur===t)sel(tabs[Math.max(0,i-1)])}
function go(v){v=v.trim();if(!v)return;const u=/^https?:\/\//.test(v)?v:/^[\w-]+(\.[\w-]+)+(:\d+)?(\/.*)?$/.test(v)||/^localhost/.test(v)?'https://'+v:S.search+encodeURIComponent(v);cur.wv.loadURL(u)}
function mod(wv,k,on){wv.executeJavaScript(`(()=>{let s=document.getElementById('nm-${k}');if(${on}){if(!s){s=document.createElement('style');s.id='nm-${k}';s.textContent=${JSON.stringify(MODS[k][1])};document.head.appendChild(s)}}else if(s)s.remove()})()`).catch(()=>{})}
$('#addr').onkeydown=e=>{if(e.key==='Enter')go(e.target.value)};$('#addr').onfocus=e=>e.target.select();
keepTabAddAtEnd();
$('#bk').onclick=()=>cur.wv.canGoBack()&&cur.wv.goBack();$('#fw').onclick=()=>cur.wv.canGoForward()&&cur.wv.goForward();$('#rl').onclick=()=>cur.wv.reload();$('#nt').onclick=()=>newTab();
$('#st').onclick=()=>{const u=cur.wv.getURL();if(isNT(u))return;const i=S.marks.findIndex(m=>m.u===u);i>=0?S.marks.splice(i,1):S.marks.push({u,t:cur.el.querySelector('span').textContent});save();$('#st').style.color=i>=0?'':'var(--acc)'};
$('#sh').onclick=async()=>{const img=await cur.wv.capturePage();const f=await ipc.invoke('save-shot',img.toPNG());toast('Captura guardada en '+f)};
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:9px 16px;background:var(--acc);color:#fff;border-radius:var(--r);z-index:9';document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
const key=k=>{if(k==='t')newTab();if(k==='w')closeTab(cur);if(k==='l'){$('#addr').focus()}if(k==='f'){$('#find').classList.add('on');$('#fi').focus()}if(k==='d')$('#st').click()};
ipc.on('key',(_,k)=>key(k));ipc.on('open-tab',(_,u)=>newTab(u));
document.addEventListener('keydown',e=>{if(e.ctrlKey&&'twlfd'.includes(e.key)){e.preventDefault();key(e.key)}if(e.key==='Escape'){$('#find').classList.remove('on');cur.wv.stopFindInPage('clearSelection')}});
$('#fi').oninput=e=>e.target.value?cur.wv.findInPage(e.target.value):cur.wv.stopFindInPage('clearSelection');$('#fx').onclick=()=>$('#find').classList.remove('on');

/* ---- Sidebar + panels ---- */
const SIDE=[['ai','Nova IA'],['mods','Mods'],['walls','Fondos'],['marks','Favoritos'],['set','Ajustes']];
let panel=null;
$('#side').innerHTML=SIDE.map(([k,n])=>`<button class="ib ${k==='ai'?'ai':''}" data-p="${k}" title="${n}">${k==='ai'?AI:ic(k)}</button>`).join('');
$('#side').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;panel=panel===b.dataset.p?null:b.dataset.p;draw()};
const sw=(k,on)=>`<div class="sw ${on?'on':''}" data-k="${k}"></div>`;
function wallList(sec){const out=[];[path.join(__dirname,'..','assets','wallpapers',sec),path.join(ud,'wallpapers',sec)].forEach(d=>{try{fs.readdirSync(d).forEach(f=>/\.(jpe?g|png|webp|svg)$/i.test(f)&&out.push(path.join(d,f)))}catch{}});return out}
let chat=[];
function draw(){
  document.querySelectorAll('#side .ib').forEach(b=>b.classList.toggle('on',b.dataset.p===panel));
  $('#panel').classList.toggle('open',!!panel);if(!panel)return;const p=$('#pin');
  if(panel==='ai'){p.innerHTML=`<div class="row"><h3>Nova IA</h3><span class="mut">${S.key?'conectada':'sin clave API'}</span></div><button class="btn" id="sum">Resumir esta página</button><div id="chat">${chat.map(m=>`<div class="m ${m.role==='user'?'u':'a'}">${esc(m.content)}</div>`).join('')||'<span class="mut">Pregúntame lo que quieras o pídeme que resuma la página abierta.</span>'}</div><div class="row"><input class="fld" id="q" placeholder="Escribe a Nova IA…"><button class="btn" id="go">Enviar</button></div>`;
    const c=$('#chat');c.scrollTop=1e9;$('#go').onclick=()=>ask($('#q').value);$('#q').onkeydown=e=>e.key==='Enter'&&ask(e.target.value);
    $('#sum').onclick=async()=>{const t=await cur.wv.executeJavaScript('document.body.innerText.slice(0,12000)').catch(()=>'');ask('Resume en español, en pocos puntos, esta página:\n\n'+t,'Resume esta página')}}
  if(panel==='mods'){p.innerHTML='<h3>Mods</h3><span class="mut">Se aplican a todas las páginas.</span>'+Object.entries(MODS).map(([k,[n]])=>`<div class="row"><span>${n}</span>${sw(k,S.mods[k])}</div>`).join('')+'<h3>Herramientas</h3><button class="btn" id="m1">Captura de pantalla</button><button class="btn" id="m2">Buscar en página (Ctrl+F)</button>';
    p.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{const k=s.dataset.k;S.mods[k]=!S.mods[k];save();tabs.forEach(t=>{try{mod(t.wv,k,S.mods[k])}catch{}});draw()});$('#m1').onclick=()=>$('#sh').click();$('#m2').onclick=()=>key('f')}
  if(panel==='walls'){const l=wallList(S.sec);p.innerHTML=`<h3>Fondos de pantalla</h3><div class="row">${Object.entries(SECS).map(([k,n])=>`<button class="btn ${S.sec===k?'on':''}" data-s="${k}">${n}</button>`).join('')}</div><div class="grid">${l.map(f=>`<div class="wp" data-f="${f.replace(/"/g,'')}" style="background-image:url('${pathToFileURL(f).href}')"></div>`).join('')}</div><button class="btn" id="add">Añadir mis imágenes</button><button class="btn" id="nowp">Quitar fondo</button>`;
    p.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.sec=b.dataset.s;save();draw()});p.querySelectorAll('.wp').forEach(w=>w.onclick=()=>setWp(w.dataset.f));$('#add').onclick=async()=>{await ipc.invoke('pick-wp',S.sec);draw()};$('#nowp').onclick=()=>setWp('')}
  if(panel==='marks'){p.innerHTML='<h3>Favoritos</h3>'+(S.marks.map((m,i)=>`<div class="row"><button class="btn" style="flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" data-u="${i}">${esc(m.t||m.u)}</button></div>`).join('')||'<span class="mut">Pulsa la estrella (Ctrl+D) para guardar la página actual.</span>');p.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>cur.wv.loadURL(S.marks[b.dataset.u].u))}
  if(panel==='set'){p.innerHTML=`<h3>Ajustes</h3><span class="mut">Tema (cambia toda la interfaz)</span><div class="grid">${Object.entries(THEMES).map(([k,n])=>`<div class="th ${S.theme===k?'on':''}" data-t="${k}" style="background:var(--bg)">${n}</div>`).join('')}</div>
  <span class="mut">Buscador</span><select class="fld" id="se"><option value="https://duckduckgo.com/?q=">DuckDuckGo</option><option value="https://www.google.com/search?q=">Google</option><option value="https://www.bing.com/search?q=">Bing</option><option value="https://search.brave.com/search?q=">Brave</option></select>
  <div class="row"><span>Bloqueador de anuncios</span>${sw('adblock',S.adblock)}</div><div class="row"><span>Animaciones de la interfaz</span>${sw('anim',S.anim)}</div><div class="row"><span>Abrir enlaces en nueva pestaña</span>${sw('newTabLinks',S.newTabLinks)}</div><span class="mut">Con Ctrl/Cmd + clic o clic central también puedes abrir un enlace en otra pestaña.</span>
  <span class="mut">Clave API de Nova IA (Anthropic)</span><input class="fld" id="ak" type="password" placeholder="sk-ant-…" value=""><span class="mut">Se guarda cifrada en el almacén seguro del sistema.</span><span class="mut">Nova 2.0 · basado en Chromium</span>`;
    $('#se').value=S.search;$('#se').onchange=e=>{S.search=e.target.value;save()};$('#ak').onchange=async e=>{const v=e.target.value.trim();if(!v)return;await NOVA.setKey(v);e.target.value='';};
    p.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.t;save();applyTheme();refreshNT();draw()});
    p.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{S[s.dataset.k]=!S[s.dataset.k];save();applyTheme();if(s.dataset.k==='newTabLinks')tabs.forEach(t=>{try{t.wv.executeJavaScript('window.__novaLinkMode='+JSON.stringify(!!S.newTabLinks))}catch{}});draw()})}
}
function setWp(f){S.wp=f;save();refreshNT()}
function refreshNT(){tabs.forEach(t=>{try{if(isNT(t.wv.getURL()))t.wv.loadURL(NT())}catch{}})}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function ask(text,shown){if(!text.trim())return;if(!S.key){chat.push({role:'assistant',content:'Añade tu clave API en Ajustes para activar Nova IA.'});return draw()}
  chat.push({role:'user',content:shown||text});const hist=chat.slice(-12).map(m=>({...m}));hist[hist.length-1].content=text;chat.push({role:'assistant',content:'…'});draw();
  try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:S.model||'claude-sonnet-4-6',max_tokens:1000,system:'Eres Nova IA, el asistente integrado del navegador Nova. Responde en el idioma del usuario, breve y claro. '+(S.persona||''),messages:hist.filter(m=>m.content!=='…')})});
    const d=await r.json();chat[chat.length-1].content=d.content?.map(c=>c.text||'').join('')||d.error?.message||'Error desconocido'}catch(e){chat[chat.length-1].content='Sin conexión: '+e.message}
  if(panel==='ai')draw()}

(async()=>{if(!localStorage.nova){const c=await ipc.invoke('install-cfg');if(c.theme)S.theme=c.theme;if(c.adblock===false)S.adblock=false;save()}applyTheme();newTab()})();
</script><script src="extras.js"></script><script src="extras2.js"></script><script src="extras3.js"></script><script src="extras4.js"></script><script src="extras5.js"></script><script src="extras6.js"></script><script src="extras7.js"></script><script src="extras8.js"></script><script src="extras9.js"></script><script src="extras10.js"></script><script src="extras11.js"></script><script src="extras12.js"></script><script src="supercat.js"></script><script src="nova25.js"></script></body></html>
