<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob:; object-src 'none'; base-uri 'none'; frame-src 'self' file:; img-src 'self' file: data: blob: https:; style-src 'self' 'unsafe-inline' file:; script-src 'self' 'unsafe-inline' file:; connect-src 'self' https://api.github.com https://github.com https:;">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova</title>
<link rel="icon" href="../assets/brand/nova-icon.png">
<link rel="stylesheet" href="nova.css">
</head>
<body>
<div id="app">
  <header id="windowbar">
    <div id="brand"><img src="../assets/brand/nova-icon.png" alt="Nova"><span>Nova</span></div>
    <div id="tabs"><button id="newTab" class="icon-btn tab-add" title="Nueva pestaña (Ctrl+T)">+</button></div>
    <div id="windowActions">
      <button class="window-btn" data-window="min" title="Minimizar">−</button>
      <button class="window-btn" data-window="max" title="Maximizar">□</button>
      <button class="window-btn close" data-window="close" title="Cerrar">×</button>
    </div>
  </header>
  <div id="toolbar">
    <div class="nav-group">
      <button class="icon-btn pill" id="back" title="Atrás">←</button>
      <button class="icon-btn pill" id="forward" title="Adelante">→</button>
      <button class="icon-btn pill" id="reload" title="Recargar">↻</button>
    </div>
    <div id="addressWrap">
      <span id="secureMark">○</span>
      <input id="address" autocomplete="off" spellcheck="false" placeholder="Buscar o escribir una dirección">
      <button id="star" class="icon-btn address-action" title="Añadir a favoritos">☆</button>
    </div>
    <div class="toolbar-actions">
      <button class="icon-btn pill" id="accentButton" title="Color de acento"><span class="accent-dot"></span></button>
      <button class="icon-btn pill" id="menuButton" title="Menú">⋮</button>
    </div>
  </div>
  <div id="workspace">
    <aside id="sidebar">
      <button class="side-item active" data-view="home" title="Inicio"><span class="sicon" data-icon="home"></span><span>Inicio</span></button>
      <button class="side-item" data-view="favorites" title="Favoritos"><span class="sicon" data-icon="star"></span><span>Favoritos</span></button>
      <button class="side-item" data-view="workspaces" title="Workspaces"><span class="sicon" data-icon="grid"></span><span>Workspaces</span></button>
      <button class="side-item" data-view="history" title="Historial"><span class="sicon" data-icon="history"></span><span>Historial</span></button>
      <button class="side-item" data-view="downloads" title="Descargas"><span class="sicon" data-icon="download"></span><span>Descargas</span></button>
      <button class="side-item" data-view="extensions" title="Extensiones"><span class="sicon" data-icon="extensions"></span><span>Extensiones</span></button>
      <button class="side-item" data-view="performance" title="Rendimiento"><span class="sicon" data-icon="bolt"></span><span>Rendimiento</span></button>
      <div class="side-spacer"></div>
      <button class="side-item" data-view="settings" title="Ajustes"><span class="sicon" data-icon="settings"></span><span>Ajustes</span></button>
    </aside>
    <main id="browserArea"><div id="views"></div></main>
  </div>
</div>
<div id="drawer" aria-hidden="true"></div>
<div id="toastStack"></div>
<script src="nova.js"></script>
</body>
</html>
