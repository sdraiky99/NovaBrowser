<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Next-Gen</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:"Segoe UI Variable","Segoe UI",Inter,system-ui,sans-serif}
.wrap{height:100%;display:grid;place-items:center;padding:18px}
.card{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;border-radius:18px;background:#202124;border:1px solid rgba(255,255,255,.12);color:#f1f3f4;text-align:center;box-shadow:0 12px 38px rgba(0,0,0,.22);animation:appear .18s ease-out}
.logo{width:88px;height:88px;display:block;object-fit:contain;margin:0 auto 16px}
.name{font-size:25px;letter-spacing:.01em;font-weight:650;line-height:1.2}
.sub{margin-top:7px;font-size:11px;letter-spacing:.12em;color:#bdc1c6;text-transform:uppercase}
.tag{margin-top:22px;font-size:12px;color:#e8eaed}
.progress{width:132px;height:3px;margin:18px auto 0;border-radius:2px;background:#3c4043;overflow:hidden}
.progress span{display:block;width:38%;height:100%;background:#8ab4f8;animation:loading 1.05s ease-in-out infinite}
@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes loading{from{transform:translateX(-120%)}to{transform:translateX(360%)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body><div class="wrap"><div class="card"><img class="logo" src="../assets/brand/nova-icon.png" alt="Nova"><div class="name">Nova</div><div class="sub">NEXT-GEN · 5.5.1</div><div class="tag">Preparando tu espacio</div><div class="progress" aria-hidden="true"><span></span></div></div></div></body>
</html>
