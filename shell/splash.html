<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,"Segoe UI Variable","Segoe UI",system-ui,sans-serif}.wrap{width:100%;height:100%;display:grid;place-items:center}.card{width:340px;padding:32px 30px 28px;border-radius:28px;background:rgba(17,24,39,.92);border:1px solid rgba(255,255,255,.10);box-shadow:0 28px 90px rgba(0,0,0,.38);text-align:center;color:#f5f7fb;animation:enter .42s cubic-bezier(.2,.75,.2,1)}.logo{width:88px;height:88px;display:block;margin:0 auto 18px;border-radius:22px;animation:logo .55s cubic-bezier(.2,.85,.2,1)}.name{font-size:26px;letter-spacing:.22em;font-weight:760;margin-left:.22em}.sub{margin-top:7px;font-size:11px;letter-spacing:.17em;color:#9ea8b7;text-transform:uppercase}.tag{margin-top:20px;font-size:12px;color:#6fd5e6;letter-spacing:.06em}.line{width:150px;height:3px;margin:18px auto 0;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}.line i{display:block;width:45%;height:100%;background:linear-gradient(90deg,#5167d9,#24b9d3);animation:load 1.05s ease-in-out infinite}@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}@keyframes logo{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><div class="wrap"><div class="card"><img class="logo" src="../assets/icon.png" alt="Nova"><div class="name">NOVA</div><div class="sub">QUANTUM 5.3</div><div class="tag">Reborn for the everyday web.</div><div class="line"><i></i></div></div></div></body></html>
