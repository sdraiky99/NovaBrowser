<meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI",sans-serif;-webkit-app-region:drag}
.c{position:absolute;inset:20px;border-radius:32px;background:radial-gradient(circle at 50% 35%,#241a4d,#0a0816 70%);box-shadow:0 0 60px #8b5cf655;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:in .45s ease-out;overflow:hidden}
.st{position:relative;width:150px;height:150px;display:grid;place-items:center}
img{width:112px;position:relative;z-index:2}
h1{margin:0;color:#fff;font-weight:300;font-size:30px;letter-spacing:.5em;padding-left:.5em;animation:sp 1.1s ease-out both}
.b{width:140px;height:3px;background:#ffffff18;border-radius:3px;overflow:hidden}.b i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--a1,#22d3ee),var(--a2,#8b5cf6));animation:ld 1s ease-in-out infinite}
.ring,.orb,.sp{position:absolute;pointer-events:none}.sp{top:50%;left:50%;margin:-3px 0 0 -3px}
@keyframes in{from{opacity:0;transform:scale(.92)}}
@keyframes sp{from{letter-spacing:1.2em;opacity:0}}
@keyframes ld{from{margin-left:-40%}to{margin-left:100%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.2) rotate(-90deg);opacity:0}}
@keyframes glow{to{filter:drop-shadow(0 0 22px var(--a1,#22d3ee))}}

/* Clásico: aparece girando, anillo de carga y brillo */
.a-classic img{animation:pop .9s cubic-bezier(.2,1.4,.4,1) both,glow 1.6s .9s ease-in-out infinite alternate}
.a-classic .ring{width:146px;height:146px;border:2px solid transparent;border-top-color:#22d3ee;border-right-color:#8b5cf6;border-radius:50%;animation:spin 1.1s linear infinite}

/* Órbita: el logo aparece y un satélite orbita alrededor */
.a-orbita{--a1:#22d3ee;--a2:#f43f5e}
.a-orbita img{animation:fade .7s ease-out both}
.a-orbita .orb{width:150px;height:150px;animation:spin 2.2s linear infinite}
.a-orbita .orb::before{content:"";position:absolute;top:-5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#fff;box-shadow:0 0 14px 4px #22d3ee}
.a-orbita .ring{width:150px;height:150px;border:1px dashed #ffffff33;border-radius:50%}
@keyframes fade{from{opacity:0;transform:scale(.7)}}

/* Estrella: destellos que salen del centro y el logo late */
.a-estrella{--a1:#fde68a;--a2:#fb923c}
.a-estrella img{animation:beat 1.2s ease-in-out infinite,fade .6s ease-out both}
@keyframes beat{50%{transform:scale(1.08);filter:drop-shadow(0 0 18px #fde68a)}}
.a-estrella .sp{width:6px;height:6px;border-radius:50%;background:#fde68a;opacity:0;animation:spark 1.4s ease-out infinite}
.a-estrella .sp:nth-child(1){--x:-70px;--y:-60px}.a-estrella .sp:nth-child(2){--x:70px;--y:-50px;animation-delay:.25s}
.a-estrella .sp:nth-child(3){--x:-60px;--y:60px;animation-delay:.5s}.a-estrella .sp:nth-child(4){--x:66px;--y:62px;animation-delay:.75s}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}

/* Cometa: entra en diagonal dejando estela */
.a-cometa{--a1:#67e8f9;--a2:#818cf8}
.a-cometa img{animation:fly .9s cubic-bezier(.15,.8,.25,1) both}
@keyframes fly{from{transform:translate(-170px,120px) scale(.5);opacity:0;filter:blur(8px)}to{transform:none;opacity:1;filter:none}}
.a-cometa .ring{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#67e8f933,#0000 65%);animation:fade 1.2s .5s ease-out both}

/* Minimal: aparición sobria, sin efectos */
.a-minimal{--a1:#0a84ff;--a2:#5ac8fa}
.a-minimal .c{background:radial-gradient(circle at 50% 35%,#ffffff,#e7e7ec 75%);box-shadow:0 20px 60px #0003}
.a-minimal h1{color:#1d1d1f;font-weight:200}.a-minimal .b{background:#0001}
.a-minimal img{animation:fade .8s ease-out both}

/* Retro 2009: ventana clara estilo Web 2.0, orbe que rebota, destello y barra verde brillante */
.a-retro09{--a1:#6fd0ff;--a2:#2f7fd0}
.a-retro09 .c{background:linear-gradient(180deg,#f4faff 0,#d6ebfb 46%,#bcdcf3 47%,#e6f3fc 100%);box-shadow:0 0 0 1px #6f93b8,0 0 0 4px #ffffffaa,0 18px 50px #0a2a5a88;border-radius:14px;inset:22px;gap:10px}
.a-retro09 .c::before{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,#ffffffcc,#ffffff22);pointer-events:none}
.a-retro09 .c::after{content:"";position:absolute;left:0;right:0;top:0;height:26px;background:linear-gradient(180deg,#e9f3fc,#b9d3ee);border-bottom:1px solid #7d9dc3;pointer-events:none}
.a-retro09 .st{margin-top:22px;width:170px;height:170px}
.a-retro09 img{width:128px;animation:r09pop 1s cubic-bezier(.2,1.6,.35,1) both,r09float 2.4s 1s ease-in-out infinite alternate;filter:drop-shadow(0 6px 8px #0a3a7a66)}
.a-retro09 .ring{width:150px;height:150px;border:0;border-radius:50%;background:radial-gradient(circle,#ffffffcc 0,#9fdcff55 45%,#0000 70%);animation:r09halo 1.6s ease-out both}
.a-retro09 .orb,.a-retro09 .sp{display:none}
.a-retro09 .sw{display:block;position:absolute;z-index:3;width:112px;height:112px;border-radius:50%;overflow:hidden;pointer-events:none;left:50%;top:50%;margin:-56px 0 0 -56px}
.a-retro09 .shine{display:block;position:absolute;width:30px;height:170px;top:-30px;left:0;background:linear-gradient(90deg,#fff0,#ffffffd0,#fff0);transform:rotate(25deg) translateX(-60px);animation:r09shine 1s .8s ease-in-out both}
.a-retro09 h1{font:400 34px "Trebuchet MS","Segoe UI",Tahoma,sans-serif;letter-spacing:0;padding:0;color:#1d4f8f;text-shadow:0 1px 0 #fff,0 0 10px #ffffffaa;animation:r09txt .8s .5s ease-out both;-webkit-box-reflect:below -2px linear-gradient(transparent 55%,#ffffff66)}
.a-retro09 h1 span{color:#2f9a2f}
.a-retro09 .msg{display:block;margin-top:20px!important;font:12px Tahoma,"Segoe UI",sans-serif;color:#46617d;animation:r09txt .6s .9s ease-out both;margin-top:4px}
.a-retro09 .b{width:190px;height:14px;border-radius:8px;background:linear-gradient(#c9d4de,#eef3f8);border:1px solid #7f95ab;box-shadow:inset 0 1px 3px #0004;margin-top:4px;position:relative;overflow:hidden}
.a-retro09 .b i{width:100%;margin:0;height:100%;border-radius:7px;background:linear-gradient(#b8f5b0 0 45%,#3fcf3f 50%,#27a827);box-shadow:inset 0 0 0 1px #ffffff88;transform-origin:left;animation:r09bar 1.55s .3s cubic-bezier(.4,.1,.3,1) both}
.a-retro09 .b i::after{content:"";position:absolute;top:0;bottom:0;width:40px;background:linear-gradient(90deg,#fff0,#ffffffaa,#fff0);animation:r09bs 1s linear infinite}
@keyframes r09pop{0%{transform:scale(.1) translateY(70px);opacity:0}55%{transform:scale(1.14) translateY(-8px);opacity:1}100%{transform:none}}
@keyframes r09float{to{transform:translateY(-5px)}}
@keyframes r09halo{from{transform:scale(.3);opacity:0}60%{opacity:1}to{transform:scale(1.25);opacity:.7}}
@keyframes r09shine{from{transform:rotate(25deg) translateX(-60px)}to{transform:rotate(25deg) translateX(150px)}}
@keyframes r09txt{from{opacity:0;transform:translateY(8px)}}
@keyframes r09bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes r09bs{from{left:-40px}to{left:100%}}
.sw,.msg{display:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style><body><div class="c"><div class="st"><div class="ring"></div><div class="orb"></div><i class="sp"></i><i class="sp"></i><i class="sp"></i><i class="sp"></i><img id="lg"><div class="sw"><i class="shine"></i></div></div><h1 id="nm">NOVA</h1><div class="msg">Iniciando Nova…</div><div class="b"><i></i></div></div>
<script>
const ok=['classic','orbita','estrella','cometa','minimal','retro09'];let l=new URLSearchParams(location.search).get('logo');if(!ok.includes(l))l='classic';
document.body.className='a-'+l;if(l==='retro09')document.getElementById('nm').innerHTML='Nova<span>.</span>';document.getElementById('lg').src=l==='classic'?'../assets/icon.png':'../assets/logos/'+l+'.png';
</script></body>
