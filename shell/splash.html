<!doctype html><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:Inter,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;-webkit-app-region:drag}.card{position:absolute;inset:18px;border:1px solid rgba(255,255,255,.10);border-radius:28px;background:rgba(17,19,24,.92);backdrop-filter:blur(18px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;box-shadow:0 22px 80px rgba(0,0,0,.42);animation:in .28s ease-out}.logo{width:104px;height:104px;filter:drop-shadow(0 12px 24px rgba(79,99,232,.28));animation:logo .46s cubic-bezier(.2,.9,.25,1) both}.name{color:#f7f8fa;font-size:25px;font-weight:700;letter-spacing:.18em}.sub{color:#9ea6b3;font-size:11px;letter-spacing:.10em}.line{width:150px;height:3px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.line i{display:block;width:45%;height:100%;background:linear-gradient(90deg,#4f63e8,#19c7e8);animation:load .9s ease-in-out infinite}@keyframes in{from{opacity:0;transform:scale(.97)}}@keyframes logo{from{opacity:0;transform:scale(.82) translateY(8px)}}@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(240%)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><div class="card"><img class="logo" src="../assets/logo/nova-quantum.svg" alt="Nova"><div class="name">NOVA</div><div class="sub">QUANTUM PRIME</div><div class="line"><i></i></div></div>
