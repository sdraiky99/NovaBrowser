<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}.c{position:absolute;inset:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border-radius:28px;background:rgba(20,18,35,.94);border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 80px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);color:#f4f2ff}.mark{width:110px;height:110px;border-radius:26px;box-shadow:0 18px 45px rgba(139,92,246,.28);animation:pop .65s cubic-bezier(.2,.9,.3,1) both}.name{font-size:28px;font-weight:650;letter-spacing:.08em}.sub{font-size:12px;color:#aaa4bd}.bar{width:180px;height:5px;border-radius:999px;background:#2c273d;overflow:hidden}.bar i{display:block;width:100%;height:100%;transform-origin:left;background:linear-gradient(90deg,#6d4aff,#22d3ee);animation:load 1.3s cubic-bezier(.2,.7,.2,1) both}@keyframes pop{from{opacity:0;transform:scale(.85) translateY(8px)}to{opacity:1;transform:none}}@keyframes load{from{transform:scaleX(.05)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><div class="c"><img class="mark" src="../assets/icon.png" alt="Nova"><div class="name">NOVA</div><div class="sub">Iniciando Nova…</div><div class="bar"><i></i></div></div></body></html>
