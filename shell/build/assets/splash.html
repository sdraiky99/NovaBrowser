<meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI",sans-serif;-webkit-app-region:drag}
.c{position:absolute;inset:20px;border-radius:32px;background:radial-gradient(circle at 50% 35%,#241a4d,#0a0816 70%);box-shadow:0 0 60px #8b5cf655;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:in .5s ease-out}
img{width:112px;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both,glow 1.6s .9s ease-in-out infinite alternate}
h1{margin:0;color:#fff;font-weight:300;font-size:30px;letter-spacing:.5em;padding-left:.5em;animation:sp 1.2s ease-out both}
.b{width:140px;height:3px;background:#ffffff18;border-radius:3px;overflow:hidden}.b i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#22d3ee,#8b5cf6);animation:ld 1s ease-in-out infinite}
@keyframes in{from{opacity:0;transform:scale(.92)}}
@keyframes pop{from{transform:scale(.2) rotate(-90deg);opacity:0}}
@keyframes glow{to{filter:drop-shadow(0 0 22px #22d3ee)}}
@keyframes sp{from{letter-spacing:1.2em;opacity:0}}
@keyframes ld{from{margin-left:-40%}to{margin-left:100%}}
</style><div class="c"><img src="../assets/icon.png"><h1>NOVA</h1><div class="b"><i></i></div></div>
