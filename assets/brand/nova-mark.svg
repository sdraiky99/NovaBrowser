<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Nova — N</title>
<desc id="desc">Marca geométrica tridimensional de Nova en azul, cian y violeta, con fondo transparente.</desc>
<defs>
  <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e5f7ff"/>
    <stop offset="0.16" stop-color="#78ddff"/>
    <stop offset="0.42" stop-color="#238ff5"/>
    <stop offset="0.68" stop-color="#5259ea"/>
    <stop offset="0.88" stop-color="#8a63f5"/>
    <stop offset="1" stop-color="#c3a5ff"/>
  </linearGradient>
  <linearGradient id="depth" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#12254d"/>
    <stop offset="0.55" stop-color="#122b69"/>
    <stop offset="1" stop-color="#301c70"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#f4fcff" stop-opacity="0.9"/>
    <stop offset="0.38" stop-color="#b9e9ff" stop-opacity="0.4"/>
    <stop offset="1" stop-color="#d7caff" stop-opacity="0.52"/>
  </linearGradient>
  <linearGradient id="face-glint" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.06"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="blur"/>
    <feOffset dy="10" dx="2" result="offset"/>
    <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.015 0 0 0 0 0.035 0 0 0 0 0.11 0 0 0 .38 0" result="shade"/>
    <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="glyph"><path d="M105 94H194L331 256V94H407V418H326L181 246V418H105Z"/></clipPath>
</defs>
<g filter="url(#shadow)">
  <!-- Extruded body, visible just beyond the front face. -->
  <path d="M105 94H194L331 256V94H407V418H326L181 246V418H105Z" transform="translate(14 17)" fill="url(#depth)" stroke="#0b1940" stroke-width="4" stroke-linejoin="round"/>
  <path d="M105 94H194L331 256V94H407V418H326L181 246V418H105Z" fill="url(#front)" stroke="url(#edge)" stroke-width="5" stroke-linejoin="round"/>
  <!-- Subtle bevels catch the light without a tile or backdrop. -->
  <path d="M113 105H188L327 269M339 105H397V407M115 407V105" fill="none" stroke="#f6fcff" stroke-opacity=".48" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M116 113H182L319 274V113H387" fill="none" stroke="url(#face-glint)" stroke-width="15" stroke-linejoin="round"/>
  <path d="M194 94L331 256V94" fill="none" stroke="#f4fbff" stroke-opacity=".3" stroke-width="3" stroke-linejoin="round"/>
  <path d="M181 246V418H105" fill="none" stroke="#182d6b" stroke-opacity=".48" stroke-width="4" stroke-linejoin="round"/>
</g>
</svg>